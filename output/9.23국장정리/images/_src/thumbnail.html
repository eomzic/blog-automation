<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Pretendard';
    src: local('AppleSDGothicNeo-Bold');
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 1080px; height: 1080px;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
  }
  .canvas {
    width: 1080px; height: 1080px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(155deg, #2d0a0a 0%, #3a0f0f 45%, #4a1414 100%);
  }
  /* soft glow accents */
  .glow-1 {
    position: absolute;
    top: -180px; right: -160px;
    width: 560px; height: 560px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,140,90,0.20) 0%, rgba(255,140,90,0) 70%);
  }
  .glow-2 {
    position: absolute;
    bottom: -220px; left: -120px;
    width: 480px; height: 480px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,60,60,0.22) 0%, rgba(200,60,60,0) 70%);
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 76px 80px 64px;
  }

  .badge {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 24px;
    font-weight: 600;
    color: #f0c9b8;
    letter-spacing: -0.2px;
  }
  .badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ff8c5a;
  }
  .badge .date { color: rgba(255,255,255,0.55); font-weight: 500; margin-left: 4px; }

  .title-wrap {
    margin-top: 92px;
    text-align: center;
  }
  .title-wrap .sub {
    font-size: 30px;
    font-weight: 600;
    color: rgba(255,255,255,0.58);
    margin-bottom: 22px;
    letter-spacing: -0.3px;
  }
  .title-wrap h1 {
    font-size: 74px;
    line-height: 1.28;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -1.5px;
  }
  .title-wrap h1 .accent {
    color: #ff9d6f;
  }

  .path-line {
    margin-top: 40px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 27px;
    font-weight: 600;
    color: rgba(255,255,255,0.72);
  }
  .path-line .arrow { color: rgba(255,255,255,0.35); font-weight: 400; }
  .path-line .down { color: #6fa8dc; }
  .path-line .up { color: #ff6b5e; }

  .accent-wave {
    margin-top: 56px;
    width: 100%;
    display: flex;
    justify-content: center;
    opacity: 0.85;
  }

  .stat-strip {
    margin-top: 56px;
    width: 100%;
    display: flex;
    border-radius: 20px;
    overflow: hidden;
    background: rgba(0,0,0,0.18);
    border: 1px solid rgba(255,255,255,0.10);
  }
  .stat-strip .cell {
    flex: 1;
    padding: 30px 24px;
    text-align: center;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  .stat-strip .cell:last-child { border-right: none; }
  .stat-strip .label {
    font-size: 22px;
    color: rgba(255,255,255,0.5);
    font-weight: 500;
    margin-bottom: 10px;
  }
  .stat-strip .value {
    font-size: 36px;
    font-weight: 800;
    color: #ff6b5e;
    letter-spacing: -0.5px;
  }

  .footer {
    margin-top: 44px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 26px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
  }
  .footer .brand .bar {
    width: 26px; height: 3px; background: #ff9d6f;
  }
  .footer .tag {
    font-size: 22px;
    color: rgba(255,255,255,0.38);
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow-1"></div>
    <div class="glow-2"></div>
    <div class="content">
      <div class="badge">
        <span class="dot"></span>
        국장정리 · 시황
        <span class="date">9.23</span>
      </div>

      <div class="title-wrap">
        <div class="sub">추석 연휴 앞 마지막 거래일</div>
        <h1>코스피 7,080 마감<br><span class="accent">반도체가 지켰다</span></h1>
      </div>

      <div class="path-line">
        <span>개장 +1.94%</span>
        <span class="arrow">→</span>
        <span class="down">장중 7,000선 위협</span>
        <span class="arrow">→</span>
        <span class="up">+0.90% 반등 마감</span>
      </div>

      <div class="accent-wave">
        <svg width="560" height="70" viewBox="0 0 560 70" fill="none">
          <path d="M0 46 C 60 8, 110 8, 165 30 C 220 52, 260 60, 300 44 C 340 28, 380 14, 430 22 C 475 29, 515 40, 560 34"
            stroke="#ff9d6f" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.55"/>
          <circle cx="165" cy="30" r="5" fill="#ff9d6f"/>
          <circle cx="300" cy="44" r="5" fill="#6fa8dc"/>
          <circle cx="560" cy="34" r="6" fill="#ff6b5e"/>
        </svg>
      </div>

      <div class="stat-strip">
        <div class="cell">
          <div class="label">코스피</div>
          <div class="value">+0.90%</div>
        </div>
        <div class="cell">
          <div class="label">코스닥</div>
          <div class="value">+1.21%</div>
        </div>
        <div class="cell">
          <div class="label">삼성전자</div>
          <div class="value">+3.07%</div>
        </div>
      </div>

      <div class="footer">
        <div class="brand"><span class="bar"></span>내일도 주린이</div>
        <div class="tag">4거래일 연속 상승</div>
      </div>
    </div>
  </div>
</body>
</html>
