<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif; }
  .card {
    width: 1000px;
    background: linear-gradient(160deg, #221012 0%, #2c1416 100%);
    padding: 56px 60px 52px;
    color: #fff;
  }
  .head { margin-bottom: 34px; }
  .head .eyebrow {
    font-size: 20px; font-weight: 700; color: #6fa8dc;
    margin-bottom: 10px;
  }
  .head h2 { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.42);
    padding: 0 0 14px;
    border-bottom: 1px solid rgba(255,255,255,0.14);
  }
  thead th.right { text-align: right; }
  tbody td {
    font-size: 23px; font-weight: 700;
    padding: 18px 0;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody td.right { text-align: right; color: #6fa8dc; font-weight: 800; }

  .stat-bar {
    margin-top: 34px;
    display: flex;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .stat-bar .seg {
    padding: 20px 0;
    text-align: center;
    flex: 1;
  }
  .stat-bar .seg .n { font-size: 26px; font-weight: 800; }
  .stat-bar .seg .l { font-size: 16px; color: rgba(255,255,255,0.5); margin-top: 4px; }
  .stat-bar .up { background: rgba(255,107,94,0.14); }
  .stat-bar .up .n { color: #ff6b5e; }
  .stat-bar .down { background: rgba(111,168,220,0.16); }
  .stat-bar .down .n { color: #6fa8dc; }
  .stat-bar .flat { background: rgba(255,255,255,0.05); }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="eyebrow">소외된 업종</div>
      <h2>조선·방산·자동차는 오늘 쉬어갔다</h2>
    </div>

    <table>
      <thead>
        <tr><th>종목</th><th class="right">등락률</th></tr>
      </thead>
      <tbody>
        <tr><td>두산에너빌리티</td><td class="right">-2.31~5.55%</td></tr>
        <tr><td>한화에어로스페이스</td><td class="right">-3.41%</td></tr>
        <tr><td>HD현대중공업</td><td class="right">-2.20~3.18%</td></tr>
        <tr><td>현대차</td><td class="right">-1.53%</td></tr>
        <tr><td>삼성바이오로직스</td><td class="right">-0.58~1.58%</td></tr>
        <tr><td>KB금융</td><td class="right">-0.57~1.20%</td></tr>
      </tbody>
    </table>

    <div class="stat-bar">
      <div class="seg up"><div class="n">311</div><div class="l">상승</div></div>
      <div class="seg down"><div class="n">548</div><div class="l">하락</div></div>
      <div class="seg flat"><div class="n">55</div><div class="l">보합</div></div>
    </div>
  </div>
</body>
</html>
