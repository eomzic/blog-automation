<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #170505;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 56px;
    background: linear-gradient(150deg, #2a0d0d 0%, #402020 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #e89466;
    background: rgba(232,148,102,0.14);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 42px;
    font-weight: 800;
    color: #f7ede8;
    letter-spacing: -1px;
    line-height: 1.3;
    margin-bottom: 36px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    text-align: left;
    font-size: 22px;
    font-weight: 600;
    color: #cbb3a9;
    padding-bottom: 16px;
    border-bottom: 1px solid rgba(255,255,255,0.14);
  }
  thead th:last-child, tbody td:last-child { text-align: right; }
  tbody td {
    padding: 26px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    font-size: 30px;
    color: #efe3dd;
  }
  tbody tr:last-child td { border-bottom: none; }
  .name { font-weight: 700; }
  .val { font-weight: 600; color: #cbb3a9; font-size: 27px; }
  .pct { font-weight: 800; font-size: 34px; }
  .down { color: #7ba9ff; }
  .up { color: #ff6f6f; }
  .note {
    margin-top: 36px;
    font-size: 25px;
    line-height: 1.6;
    color: #d8c3bb;
  }
  .note b { color: #e89466; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">코스피 vs 코스닥 · 9.28 마감</div>
    <h2>코스피는 2.70% 급락, 코스닥은 나홀로 플러스</h2>
    <table>
      <thead>
        <tr><th>구분</th><th>9/23 종가 → 9/28 종가</th><th>등락률</th></tr>
      </thead>
      <tbody>
        <tr>
          <td class="name">코스피</td>
          <td class="val">7,080.92 → 6,889.74</td>
          <td class="pct down">-2.70%</td>
        </tr>
        <tr>
          <td class="name">코스닥</td>
          <td class="val">844.48 → 846.58</td>
          <td class="pct up">+0.25%</td>
        </tr>
      </tbody>
    </table>
    <div class="note">추석 연휴 나흘 동안 쌓인 해외 변수가 개장과 동시에 반영되며 코스피는 <b>7000선을 반납</b>했지만, 코스닥은 HLB발 바이오 훈풍에 힘입어 정반대 흐름을 보였어요.</div>
  </div>
</body>
</html>
