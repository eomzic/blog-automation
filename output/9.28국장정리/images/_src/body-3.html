<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #170505;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 60px;
    background: linear-gradient(150deg, #2a0d0d 0%, #402020 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #e89466;
    background: rgba(232,148,102,0.14);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 40px;
    font-weight: 800;
    color: #f7ede8;
    letter-spacing: -1px;
    line-height: 1.3;
    margin-bottom: 44px;
  }
  .bars { display: flex; flex-direction: column; gap: 34px; }
  .bar-row .top-line {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .bar-row .label {
    font-size: 28px;
    font-weight: 700;
    color: #f2e6e0;
  }
  .bar-row .amount {
    font-size: 30px;
    font-weight: 800;
  }
  .bar-row .amount.down { color: #7ba9ff; }
  .bar-row .amount.up { color: #ff6f6f; }
  .track {
    position: relative;
    width: 100%;
    height: 26px;
    background: rgba(255,255,255,0.06);
    border-radius: 13px;
    overflow: hidden;
  }
  .fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    border-radius: 13px;
  }
  .fill.down { background: linear-gradient(90deg, #4f7fe0, #7ba9ff); }
  .fill.up { background: linear-gradient(90deg, #e0524f, #ff6f6f); }
  .note {
    margin-top: 44px;
    font-size: 25px;
    line-height: 1.6;
    color: #d8c3bb;
  }
  .note b { color: #e89466; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">수급 동향 · 9.28</div>
    <h2>외국인·기관 4조원 넘게 팔고, 개인만 순매수</h2>
    <div class="bars">
      <div class="bar-row">
        <div class="top-line">
          <div class="label">외국인</div>
          <div class="amount down">-3조 2,263억원</div>
        </div>
        <div class="track"><div class="fill down" style="width: 100%;"></div></div>
      </div>
      <div class="bar-row">
        <div class="top-line">
          <div class="label">기관</div>
          <div class="amount down">-1조 174억원</div>
        </div>
        <div class="track"><div class="fill down" style="width: 32%;"></div></div>
      </div>
      <div class="bar-row">
        <div class="top-line">
          <div class="label">개인</div>
          <div class="amount up">+2조 6,054억원</div>
        </div>
        <div class="track"><div class="fill up" style="width: 81%;"></div></div>
      </div>
    </div>
    <div class="note">외국인 매도는 <b>SK하이닉스 1조 7,275억원, 삼성전자 1조 3,757억원</b>에 집중됐어요. 반도체 2종목에만 3조원 넘는 매도가 쏠린 하루였습니다.</div>
  </div>
</body>
</html>
