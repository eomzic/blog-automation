<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif; }
  .card {
    width: 1000px;
    background: linear-gradient(160deg, #1a1a2e 0%, #222b47 100%);
    padding: 54px 58px 50px;
    color: #fff;
  }
  .head { margin-bottom: 40px; }
  .head .eyebrow {
    font-size: 20px; font-weight: 700; color: #9fb0ef;
    margin-bottom: 10px;
    letter-spacing: -0.2px;
  }
  .head h2 { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; }

  .compare {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 20px;
    margin-bottom: 36px;
  }
  .stat {
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
  }
  .stat .label {
    font-size: 18px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    margin-bottom: 14px;
  }
  .stat .value {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.1;
  }
  .stat.earn .value { color: #ff8585; }
  .stat .sub {
    margin-top: 10px;
    font-size: 16px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
  }
  .stat.price .value { color: #7c93ef; }
  .vs {
    font-size: 22px;
    font-weight: 800;
    color: rgba(255,255,255,0.25);
  }

  .note {
    padding: 24px 28px;
    border-radius: 18px;
    background: rgba(0,0,0,0.18);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 20px;
    line-height: 1.6;
    color: rgba(255,255,255,0.72);
  }
  .note b { color: #b7c3f7; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="eyebrow">삼성전자 · 10/8(목) 마감 기준</div>
      <h2>실적은 역대급, 주가는 하락</h2>
    </div>

    <div class="compare">
      <div class="stat earn">
        <div class="label">3분기 영업이익</div>
        <div class="value">107.4조</div>
        <div class="sub">전년 대비 +782.5%</div>
      </div>
      <div class="vs">vs</div>
      <div class="stat price">
        <div class="label">당일 주가</div>
        <div class="value">-2.23%</div>
        <div class="sub">₩262,500 마감</div>
      </div>
    </div>

    <div class="note">
      세계 최초로 단일 분기 <b>영업이익 100조원</b>을 넘겼지만, 15조원 자사주 매입 조기 종료 + 옵션만기일이 겹치며 외국인·기관이 2조원 넘게 동반 매도 — 실적이 아니라 <b>수급이 이긴 하루</b>였어요.
    </div>
  </div>
</body>
</html>
