<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif; }
  .card {
    width: 1000px;
    background: linear-gradient(160deg, #1a1a2e 0%, #222b47 100%);
    padding: 54px 58px 50px;
    color: #fff;
  }
  .head { margin-bottom: 36px; }
  .head .eyebrow {
    font-size: 20px; font-weight: 700; color: #9fb0ef;
    margin-bottom: 10px;
    letter-spacing: -0.2px;
  }
  .head h2 { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; }

  .holding-row {
    display: flex;
    gap: 14px;
    margin-bottom: 30px;
  }
  .holding-row .chip {
    flex: 1;
    background: rgba(0,0,0,0.18);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 18px 20px;
  }
  .holding-row .chip .k { font-size: 15px; color: rgba(255,255,255,0.45); font-weight: 600; margin-bottom: 6px; }
  .holding-row .chip .v { font-size: 21px; font-weight: 800; }
  .holding-row .chip .v.loss { color: #7c93ef; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 16px;
    font-weight: 700;
    color: rgba(255,255,255,0.45);
    padding: 0 0 14px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  tbody td {
    font-size: 19px;
    font-weight: 600;
    padding: 18px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody td.flag {
    font-size: 15px;
    font-weight: 700;
    color: #ffd27a;
  }
  td.up { color: #ff8585; }
  td.down { color: #7c93ef; }
  tr.highlight td { color: #ffd27a; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="eyebrow">두산로보틱스 · 34주 보유 (평단 134,674원)</div>
      <h2>9일 전 숫자가 그대로 찍혀 있었어요</h2>
    </div>

    <div class="holding-row">
      <div class="chip">
        <div class="k">평가손익</div>
        <div class="v loss">-2,093,516원</div>
      </div>
      <div class="chip">
        <div class="k">수익률</div>
        <div class="v loss">-45.7%</div>
      </div>
    </div>

    <table>
      <thead>
        <tr><th>날짜</th><th>종가</th><th>등락률</th><th>비고</th></tr>
      </thead>
      <tbody>
        <tr>
          <td>10/2 (금)</td>
          <td>73,100원</td>
          <td class="up">+1.81%</td>
          <td class="flag">9일 전 실제값</td>
        </tr>
        <tr>
          <td>10/8 (목)</td>
          <td>69,300원</td>
          <td class="down">-2.67%</td>
          <td style="color:rgba(255,255,255,0.4); font-weight:600; font-size:15px;">실제 마지막 거래일</td>
        </tr>
        <tr class="highlight">
          <td>앱 표시 (10/11)</td>
          <td>73,100원</td>
          <td class="up">+1.81%</td>
          <td class="flag">10/2와 완전 일치 — 갱신 의심</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
