<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 1080px; height: 1080px;
    font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  }
  .canvas {
    width: 1080px; height: 1080px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(165deg, #1a1a2e 0%, #16213e 100%);
  }
  .accent-dot {
    position: absolute;
    top: 64px; right: 76px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #7c93ef;
    box-shadow: 0 0 36px 10px rgba(124,147,239,0.35);
  }
  .grid-line {
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: rgba(255,255,255,0.04);
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    padding: 80px 84px 64px;
  }

  .badge {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 23px;
    font-weight: 600;
    color: #aebcf2;
    letter-spacing: -0.2px;
  }
  .badge .date { color: rgba(255,255,255,0.4); font-weight: 500; margin-left: 2px; }

  .main {
    margin-top: 58px;
  }
  .eyebrow {
    font-size: 27px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  .title {
    font-size: 66px;
    font-weight: 800;
    color: #f3f4fb;
    letter-spacing: -1.5px;
    line-height: 1.3;
    margin-bottom: 34px;
  }
  .title .num { color: #8fa3f5; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: rgba(0,0,0,0.22);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 15px 26px;
  }
  .chip .prev { font-size: 21px; font-weight: 600; color: rgba(255,255,255,0.4); }
  .chip .arrow { font-size: 18px; color: rgba(255,255,255,0.28); }
  .chip .now { font-size: 23px; font-weight: 800; color: #9db3ff; }

  .spacer { flex: 1; }

  .bars-wrap {
    margin-top: 28px;
  }
  .bars-label {
    font-size: 20px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    margin-bottom: 28px;
    letter-spacing: -0.2px;
  }
  .bars {
    display: flex;
    align-items: flex-end;
    gap: 22px;
    height: 220px;
  }
  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
  }
  .bar-pct {
    font-size: 20px;
    font-weight: 700;
    color: #b7c3f7;
    margin-bottom: 14px;
    white-space: nowrap;
  }
  .bar {
    width: 100%;
    max-width: 52px;
    border-radius: 8px 8px 0 0;
    background: linear-gradient(180deg, #8fa3f5 0%, #5a6fc4 100%);
  }
  .bar-name {
    margin-top: 14px;
    font-size: 17px;
    font-weight: 600;
    color: rgba(255,255,255,0.48);
    text-align: center;
    letter-spacing: -0.2px;
  }

  .footer {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 44px;
  }
  .footer .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 26px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
  }
  .footer .brand .bar-mark { width: 26px; height: 3px; background: #7c93ef; }
  .footer .tag { font-size: 22px; color: rgba(255,255,255,0.36); font-weight: 500; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="accent-dot"></div>
    <div class="content">
      <div class="badge">
        포트폴리오 점검
        <span class="date">10.11</span>
      </div>

      <div class="main">
        <div class="eyebrow">삼성전자 107조 실적에도 급락, 실보유 6종목 점검</div>
        <div class="title">손실률 <span class="num">-38.4%</span><br>소폭 줄었어요</div>
        <div class="chip">
          <span class="prev">10/5 -39.1%</span>
          <span class="arrow">→</span>
          <span class="now">10/11 -38.4%</span>
        </div>
      </div>

      <div class="spacer"></div>

      <div class="bars-wrap">
        <div class="bars-label">종목별 평가손익률</div>
        <div class="bars">
          <div class="bar-col">
            <div class="bar-pct">-29.3%</div>
            <div class="bar" style="height:49%;"></div>
            <div class="bar-name">삼성전자</div>
          </div>
          <div class="bar-col">
            <div class="bar-pct">-45.7%</div>
            <div class="bar" style="height:77%;"></div>
            <div class="bar-name">두산로보틱스</div>
          </div>
          <div class="bar-col">
            <div class="bar-pct">-59.3%</div>
            <div class="bar" style="height:100%;"></div>
            <div class="bar-name">PL</div>
          </div>
          <div class="bar-col">
            <div class="bar-pct">-18.8%</div>
            <div class="bar" style="height:32%;"></div>
            <div class="bar-name">ORCL</div>
          </div>
          <div class="bar-col">
            <div class="bar-pct">-50.7%</div>
            <div class="bar" style="height:85%;"></div>
            <div class="bar-name">RDW</div>
          </div>
          <div class="bar-col">
            <div class="bar-pct">-28.0%</div>
            <div class="bar" style="height:47%;"></div>
            <div class="bar-name">NASA</div>
          </div>
        </div>
      </div>

      <div class="footer">
        <div class="brand"><span class="bar-mark"></span>내일도 주린이</div>
        <div class="tag">국내 2종목 · 미국 4종목</div>
      </div>
    </div>
  </div>
</body>
</html>
