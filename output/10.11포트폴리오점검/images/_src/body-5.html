<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif; }
  .card {
    width: 1000px;
    background: linear-gradient(160deg, #1a1a2e 0%, #222b47 100%);
    padding: 54px 58px 50px;
    color: #fff;
  }
  .head { margin-bottom: 36px; }
  .head .eyebrow {
    font-size: 20px; font-weight: 700; color: #9fb0ef;
    margin-bottom: 10px;
    letter-spacing: -0.2px;
  }
  .head h2 { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; }

  .compare {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
  }
  .stat {
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 30px 24px;
    text-align: center;
  }
  .stat .label { font-size: 17px; font-weight: 600; color: rgba(255,255,255,0.5); margin-bottom: 12px; }
  .stat .value { font-size: 40px; font-weight: 800; letter-spacing: -1px; }
  .stat.app .value { color: #ff8585; }
  .stat.real .value { color: #7c93ef; }
  .vs { font-size: 20px; font-weight: 800; color: rgba(255,255,255,0.25); }

  .note {
    padding: 22px 26px;
    border-radius: 18px;
    background: rgba(255,210,122,0.08);
    border: 1px solid rgba(255,210,122,0.25);
    font-size: 19px;
    line-height: 1.6;
    color: rgba(255,255,255,0.78);
    margin-bottom: 26px;
  }
  .note b { color: #ffd27a; }

  .foot-chip {
    display: flex;
    gap: 14px;
  }
  .foot-chip > div {
    flex: 1;
    background: rgba(0,0,0,0.16);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 14px 18px;
    font-size: 16px;
    color: rgba(255,255,255,0.6);
    font-weight: 600;
  }
  .foot-chip b { color: #fff; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="eyebrow">NASA ETF (Tema Space Innovators) · 1주 보유</div>
      <h2>이번엔 방향 자체가 달랐어요</h2>
    </div>

    <div class="compare">
      <div class="stat app">
        <div class="label">제 앱 표시</div>
        <div class="value">+1.08%</div>
      </div>
      <div class="vs">vs</div>
      <div class="stat real">
        <div class="label">10/9 실제 정규장</div>
        <div class="value">-0.12%</div>
      </div>
    </div>

    <div class="note">
      폭이 아니라 <b>부호(방향) 자체가 반대</b>였던 6종목 중 유일한 사례예요.
    </div>

    <div class="foot-chip">
      <div>평단 <b>$35.11</b></div>
      <div>마감가 <b>$25.27</b></div>
      <div>평가손익 <b style="color:#7c93ef;">-$9.84 (-28.0%)</b></div>
    </div>
  </div>
</body>
</html>
