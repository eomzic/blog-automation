<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #0f1012;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 56px;
    background: linear-gradient(150deg, #201d24 0%, #322c3a 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #c9a6ff;
    background: rgba(201,166,255,0.12);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 42px;
    font-weight: 800;
    color: #f5f6f7;
    letter-spacing: -1px;
    line-height: 1.3;
    margin-bottom: 32px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    text-align: left;
    font-size: 21px;
    font-weight: 600;
    color: #a79cc0;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }
  thead th:last-child, tbody td:last-child { text-align: right; }
  tbody td {
    padding: 20px 0;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    font-size: 26px;
    color: #e7e8ea;
  }
  tbody tr:last-child td { border-bottom: none; }
  .name { font-weight: 700; }
  .src { font-size: 19px; color: #8f89a0; display: block; margin-top: 4px; }
  .val { font-weight: 700; font-size: 27px; }
  .up { color: #ff7b7b; }
  .down { color: #6fb3ff; }
  .note {
    margin-top: 32px;
    font-size: 24px;
    line-height: 1.6;
    color: #aeb1b6;
  }
  .note b { color: #c9a6ff; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">유가·금·달러 · 9.24</div>
    <h2>소스마다 숫자가 다르게 나온 하루</h2>
    <table>
      <thead>
        <tr><th>자산</th><th>수치</th></tr>
      </thead>
      <tbody>
        <tr>
          <td class="name">브렌트유<span class="src">BNN Bloomberg 최종치</span></td>
          <td class="val up">$100.22 (+2.1%)</td>
        </tr>
        <tr>
          <td class="name">브렌트유<span class="src">야후파이낸스 장중</span></td>
          <td class="val up">$105 상회 (+3%대)</td>
        </tr>
        <tr>
          <td class="name">WTI</td>
          <td class="val">$91~92</td>
        </tr>
        <tr>
          <td class="name">금(온스당)</td>
          <td class="val down">$4,250.85 (-0.85%)</td>
        </tr>
        <tr>
          <td class="name">달러인덱스<span class="src">TradingEconomics / RioTimes</span></td>
          <td class="val">101.08 (-0.02%) / 101.18 (+0.58%)</td>
        </tr>
      </tbody>
    </table>
    <div class="note">호르무즈 이슈로 장중 변동성이 워낙 컸던 탓에 매체별 편차가 컸어요. <b>정확한 숫자보다 &ldquo;혼조세였다&rdquo; 정도로 이해</b>하는 게 안전할 것 같습니다.</div>
  </div>
</body>
</html>
