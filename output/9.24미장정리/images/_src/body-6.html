<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #0f1012;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 60px;
    background: linear-gradient(150deg, #202124 0%, #34373a 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #e8b34d;
    background: rgba(232,179,77,0.12);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 42px;
    font-weight: 800;
    color: #f5f6f7;
    letter-spacing: -1px;
    line-height: 1.3;
    margin-bottom: 36px;
  }
  .points {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .point {
    display: flex;
    gap: 24px;
    padding: 26px 30px;
    background: rgba(255,255,255,0.045);
    border-radius: 18px;
    align-items: flex-start;
  }
  .point .who {
    flex: 0 0 220px;
    font-size: 25px;
    font-weight: 700;
    color: #f2c572;
    line-height: 1.4;
  }
  .point .what {
    flex: 1;
    font-size: 26px;
    color: #e7e8ea;
    font-weight: 500;
    line-height: 1.55;
  }
  .divider {
    width: 1px;
    align-self: stretch;
    background: rgba(255,255,255,0.1);
  }
  .foot {
    margin-top: 34px;
    font-size: 24px;
    line-height: 1.6;
    color: #aeb1b6;
  }
  .foot b { color: #f2c572; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">전망 · 기관 코멘트</div>
    <h2>&ldquo;성장 기초체력은 살아있다&rdquo;는 목소리도</h2>
    <div class="points">
      <div class="point">
        <div class="who">바클레이즈<br>전략가</div>
        <div class="divider"></div>
        <div class="what">헤드라인은 불길해 보이지만 성장의 기초 체력은 유지되고 있다</div>
      </div>
      <div class="point">
        <div class="who">에드 야르데니<br>(Yardeni Research)</div>
        <div class="divider"></div>
        <div class="what">S&amp;P500 연말 목표 8,400 → 7,900 하향 (9/16 시점)</div>
      </div>
      <div class="point">
        <div class="who">스탠다드은행<br>스티븐 배로우</div>
        <div class="divider"></div>
        <div class="what">10년물 연말 5.2%, 2027년 1분기 5.3%까지 전망</div>
      </div>
    </div>
    <div class="foot">중간선거를 앞두고 당분간 <b>변동성 장세</b>가 이어질 거라는 게 시장 컨센서스라고 해요.</div>
  </div>
</body>
</html>
