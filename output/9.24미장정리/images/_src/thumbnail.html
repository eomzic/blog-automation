<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Pretendard';
    src: local('Apple SD Gothic Neo');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1080px;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', -apple-system, sans-serif;
    overflow: hidden;
  }
  .canvas {
    position: relative;
    width: 1080px; height: 1080px;
    background: linear-gradient(160deg, #1d1e21 0%, #2b2d30 45%, #3f4245 100%);
    overflow: hidden;
  }
  .glow {
    position: absolute;
    bottom: -220px; left: -180px;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(232,179,77,0.20) 0%, rgba(232,179,77,0) 70%);
  }
  .glow2 {
    position: absolute;
    top: -160px; right: -160px;
    width: 520px; height: 520px;
    background: radial-gradient(circle, rgba(120,140,160,0.18) 0%, rgba(120,140,160,0) 70%);
  }
  .badge {
    position: absolute;
    top: 96px; left: 96px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 999px;
  }
  .badge .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #e8b34d;
  }
  .badge span {
    font-size: 27px;
    font-weight: 600;
    color: #cfd2d6;
    letter-spacing: -0.3px;
  }
  .badge .date { color: #8b8e93; margin-left: 4px; }

  .content {
    position: absolute;
    top: 330px; left: 96px;
    width: 780px;
  }
  .eyebrow {
    font-size: 30px;
    font-weight: 600;
    color: #9a9da2;
    margin-bottom: 22px;
    letter-spacing: -0.3px;
  }
  .title {
    font-size: 92px;
    font-weight: 800;
    line-height: 1.22;
    letter-spacing: -1.5px;
    color: #f5f6f7;
  }
  .title .accent {
    background: linear-gradient(90deg, #f2c572, #e8b34d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: block;
  }
  .stat-line {
    margin-top: 40px;
    font-size: 30px;
    font-weight: 500;
    color: #b7bac0;
    letter-spacing: -0.3px;
  }
  .stat-line .down { color: #6fb3ff; font-weight: 700; }
  .stat-line .up { color: #ff7b7b; font-weight: 700; }

  .rate-card {
    position: absolute;
    bottom: 110px; right: 96px;
    width: 560px;
    padding: 36px 40px;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(232,179,77,0.28);
    border-radius: 24px;
    text-align: right;
  }
  .rate-card .label {
    font-size: 25px;
    font-weight: 600;
    color: #a9acb1;
    margin-bottom: 10px;
  }
  .rate-card .num {
    font-size: 78px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #f2c572;
  }
  .rate-card .sub {
    margin-top: 8px;
    font-size: 24px;
    font-weight: 600;
    color: #8b8e93;
  }

  .footer {
    position: absolute;
    bottom: 96px; left: 96px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .footer .bar {
    width: 34px; height: 4px;
    background: #e8b34d;
    border-radius: 2px;
  }
  .footer .name {
    font-size: 27px;
    font-weight: 700;
    color: #d6d8db;
    letter-spacing: -0.3px;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="glow2"></div>

    <div class="badge">
      <div class="dot"></div>
      <span>미장정리 · 시황<span class="date">  9.24</span></span>
    </div>

    <div class="content">
      <div class="eyebrow">지수는 진정됐는데</div>
      <div class="title">
        낙폭은 줄었는데
        <span class="accent">금리는 더 뛰었다</span>
      </div>
      <div class="stat-line">
        다우 <span class="down">-0.31%</span> · S&P500 <span class="down">-0.02%</span> · 나스닥 <span class="up">+0.01%</span>
      </div>
    </div>

    <div class="rate-card">
      <div class="label">10년물 국채금리 · 2007년 이후 최고</div>
      <div class="num">5.225%</div>
      <div class="sub">30년물 5.43~5.50% · 모기지 7.37%</div>
    </div>

    <div class="footer">
      <div class="bar"></div>
      <div class="name">내일도 주린이</div>
    </div>
  </div>
</body>
</html>
