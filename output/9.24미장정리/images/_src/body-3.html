<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #0f1012;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 60px;
    background: linear-gradient(150deg, #202124 0%, #34373a 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #e8b34d;
    background: rgba(232,179,77,0.12);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 42px;
    font-weight: 800;
    color: #f5f6f7;
    letter-spacing: -1px;
    line-height: 1.3;
    margin-bottom: 48px;
  }
  .timeline {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    position: relative;
    padding-top: 8px;
  }
  .timeline::before {
    content: "";
    position: absolute;
    top: 24px;
    left: 20px;
    right: 20px;
    height: 3px;
    background: linear-gradient(90deg, rgba(111,179,255,0.5), rgba(242,197,114,0.8));
  }
  .step {
    position: relative;
    width: 23%;
    text-align: center;
  }
  .dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #3a3d40;
    border: 3px solid #6fb3ff;
    margin: 0 auto 22px;
    position: relative;
    z-index: 2;
  }
  .step.last .dot {
    border-color: #f2c572;
    background: #f2c572;
    box-shadow: 0 0 0 8px rgba(242,197,114,0.18);
  }
  .step .time {
    font-size: 21px;
    font-weight: 600;
    color: #9a9da2;
    margin-bottom: 10px;
  }
  .step .val {
    font-size: 32px;
    font-weight: 800;
    color: #e7e8ea;
    letter-spacing: -0.5px;
  }
  .step.last .val { color: #f2c572; font-size: 36px; }
  .foot {
    margin-top: 44px;
    font-size: 25px;
    line-height: 1.6;
    color: #aeb1b6;
  }
  .foot b { color: #f2c572; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">10년물 국채금리 흐름</div>
    <h2>주가는 진정됐는데 금리는 하루 종일 더 올랐다</h2>
    <div class="timeline">
      <div class="step">
        <div class="dot"></div>
        <div class="time">9/23 마감</div>
        <div class="val">5.135%</div>
      </div>
      <div class="step">
        <div class="dot"></div>
        <div class="time">9/24 장중</div>
        <div class="val">5.17~5.20%</div>
      </div>
      <div class="step">
        <div class="dot"></div>
        <div class="time">9/24 마감 무렵</div>
        <div class="val">5.11~5.13%</div>
      </div>
      <div class="step last">
        <div class="dot"></div>
        <div class="time">9/24 늦은 시간</div>
        <div class="val">5.225%</div>
      </div>
    </div>
    <div class="foot">한때 되밀렸다가 늦은 시간 다시 튀어올라 <b>2007년 이후 최고치</b>를 재경신했어요. 30년물은 5.43~5.50%, 모기지 30년 고정은 7.37%까지 올랐습니다.</div>
  </div>
</body>
</html>
