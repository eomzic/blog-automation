<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; }
  .card {
    width: 1000px;
    background: linear-gradient(160deg, #1b0a30 0%, #2c1150 100%);
    padding: 58px 60px 54px;
    color: #fff;
  }
  .eyebrow {
    font-size: 20px; font-weight: 700; color: #d9a8ff;
    margin-bottom: 24px;
  }

  .quote-box {
    position: relative;
    border-left: 5px solid #ffb4e0;
    background: rgba(255,255,255,0.05);
    border-radius: 4px 18px 18px 4px;
    padding: 40px 44px;
  }
  .quote-box .mark {
    position: absolute;
    top: 14px; left: 30px;
    font-size: 64px;
    font-weight: 800;
    color: rgba(255,180,224,0.25);
    line-height: 1;
    font-family: Georgia, serif;
  }
  .quote-box .line {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 14px;
  }
  .quote-box .price {
    font-size: 46px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -1px;
  }
  .quote-box .chg {
    font-size: 30px;
    font-weight: 800;
    color: #ff9d9d;
  }
  .quote-box .price2 {
    margin-top: 4px;
    font-size: 24px;
    font-weight: 600;
    color: rgba(255,255,255,0.6);
  }
  .quote-box .price2 .chg2 { color: #ff9d9d; font-weight: 700; }

  .desc {
    margin-top: 34px;
    font-size: 22px;
    line-height: 1.75;
    color: rgba(255,255,255,0.75);
    font-weight: 500;
  }
  .desc b { color: #ffb4e0; }

  .tags {
    margin-top: 28px;
    display: flex;
    gap: 12px;
  }
  .tags span {
    font-size: 18px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    padding: 9px 18px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">유가 · 지정학 리스크</div>

    <div class="quote-box">
      <div class="mark">"</div>
      <div class="line">
        <span class="price">103.08달러</span>
        <span class="chg">+3.9%</span>
      </div>
      <div class="price2">브렌트유 11월물 · 12월물은 <span class="chg2">+2.8%</span> 98.12달러</div>
    </div>

    <div class="desc">
      이란 대통령의 유엔 연설, 트럼프의 이란 압박 발언, 다가오는 <b>트럼프-시진핑 정상회담</b>까지 지정학 변수가 한꺼번에 겹쳤어요. 전쟁 우려 이전 배럴당 72달러였던 걸 생각하면 꽤 큰 폭의 상승입니다.
    </div>

    <div class="tags">
      <span>이란 유엔 연설</span>
      <span>트럼프 압박 발언</span>
      <span>미중 정상회담 대기</span>
    </div>
  </div>
</body>
</html>
