<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif; }
  .card {
    width: 1000px;
    background: linear-gradient(160deg, #232526 0%, #2f3234 55%, #3a3d40 100%);
    padding: 58px 64px 52px;
    color: #fff;
  }
  .eyebrow {
    font-size: 20px; font-weight: 700; color: #9fb3d9;
    margin-bottom: 26px; letter-spacing: -0.2px;
  }

  .quote-mark {
    font-size: 70px;
    font-weight: 800;
    color: rgba(159,179,217,0.3);
    line-height: 1;
    margin-bottom: -10px;
  }
  .quote {
    font-size: 32px;
    font-weight: 800;
    line-height: 1.5;
    letter-spacing: -0.6px;
    color: #fff;
    margin-bottom: 40px;
  }
  .quote b { color: #7c93ef; }

  .stats {
    display: flex;
    gap: 20px;
    margin-bottom: 32px;
  }
  .stat {
    flex: 1;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 18px;
    padding: 26px 24px;
  }
  .stat .lbl {
    font-size: 16px; font-weight: 600;
    color: rgba(255,255,255,0.5);
    margin-bottom: 10px;
  }
  .stat .val {
    font-size: 38px; font-weight: 800;
    letter-spacing: -0.8px;
    color: #7c93ef;
  }
  .stat .sub {
    margin-top: 8px;
    font-size: 14px; font-weight: 600;
    color: rgba(255,255,255,0.4);
  }
  .stat.port .val { color: #fff; }
  .stat.port .arrow-row { font-size: 20px; font-weight: 800; color: #7c93ef; }
  .stat.port .arrow-row span.from { color: rgba(255,255,255,0.4); font-size: 18px; margin-right: 6px; }

  .note {
    font-size: 17px;
    line-height: 1.6;
    color: rgba(255,255,255,0.55);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">나스닥 주간 vs 포트폴리오 손실률</div>
    <div class="quote-mark">"</div>
    <div class="quote">손실 확대 구간(10/19~10/23)이<br><b>나스닥 최악의 한 주</b>와 정확히 겹쳤어요</div>

    <div class="stats">
      <div class="stat">
        <div class="lbl">나스닥 주간 등락률</div>
        <div class="val">-4.5%</div>
        <div class="sub">6월 이후 최악의 한 주</div>
      </div>
      <div class="stat port">
        <div class="lbl">포트폴리오 손실률 변화</div>
        <div class="arrow-row"><span class="from">10/11 -38.4%</span>→ -49.6%</div>
        <div class="sub">2주 사이 11.2%p 확대</div>
      </div>
    </div>

    <div class="note">특정 종목 하나의 문제가 아니라, 그 주 전체 장 분위기를 포트폴리오가 그대로 떠안은 결과로 보여요.</div>
  </div>
</body>
</html>
