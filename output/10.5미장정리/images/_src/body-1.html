<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><style>
* { box-sizing:border-box; margin:0; padding:0; }
body { width:1080px; height:1080px; font-family:'Apple SD Gothic Neo','Malgun Gothic','Pretendard',sans-serif; color:#f2f7f5; overflow:hidden; }

body { background:#0f2027; padding:100px 90px; }
.tag { font-size:34px; color:#7fb5a8; }
h2 { margin-top:24px; font-size:70px; font-weight:800; line-height:1.25; }
.list { margin-top:90px; }
.row { display:flex; align-items:center; height:150px; border-bottom:1px solid rgba(255,255,255,.08); }
.name { width:250px; font-size:38px; color:#cfe9e2; }
.track { flex:1; height:34px; background:rgba(255,255,255,.06); border-radius:17px; overflow:hidden; margin-right:40px; }
.fill { height:100%; background:linear-gradient(90deg,#134e4a,#ff6b6b); border-radius:17px; }
.val { width:270px; text-align:right; }
.c { font-size:40px; font-weight:700; }
.p { font-size:34px; font-weight:700; margin-top:4px; }
.note { position:absolute; left:90px; bottom:110px; font-size:32px; color:#a8d8cc; }
</style></head><body>
<div class="tag">10/5 뉴욕 정규장 마감 · 등락률</div>
<h2>3대 지수 모두 상승,<br>기술주가 끌어올렸다</h2>
<div class="list"><div class="row"><div class="name">S&P 500</div>
        <div class="track"><div class="fill" style="width:389px"></div></div>
        <div class="val"><div class="c">7,773.95</div><div class="p" style="color:#ff6b6b">+0.66%</div></div></div><div class="row"><div class="name">나스닥 종합</div>
        <div class="track"><div class="fill" style="width:620px"></div></div>
        <div class="val"><div class="c">27,477.31</div><div class="p" style="color:#ff6b6b">+1.05%</div></div></div><div class="row"><div class="name">다우 산업</div>
        <div class="track"><div class="fill" style="width:106px"></div></div>
        <div class="val"><div class="c">51,267.90</div><div class="p" style="color:#ff6b6b">+0.18%</div></div></div></div>
<div class="note">막대 길이는 나스닥 등락률 기준 상대 비교 (합성 그래픽)</div>
</body></html>
