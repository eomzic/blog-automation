<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #17181a;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 60px;
    background: linear-gradient(150deg, #1c1d1f 0%, #33373b 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #9db4cc;
    background: rgba(111,168,255,0.12);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 42px;
    font-weight: 800;
    color: #f3f5f6;
    letter-spacing: -1px;
    line-height: 1.32;
    margin-bottom: 40px;
  }
  .compare { display: flex; gap: 20px; margin-bottom: 32px; }
  .box {
    flex: 1;
    padding: 34px 28px;
    border-radius: 20px;
    text-align: center;
  }
  .box.boeing {
    background: rgba(111,168,255,0.10);
    border: 1px solid rgba(111,168,255,0.30);
  }
  .box.nvidia {
    background: rgba(255,111,111,0.10);
    border: 1px solid rgba(255,111,111,0.30);
  }
  .box .lbl { font-size: 25px; font-weight: 700; color: #dfe4e7; margin-bottom: 12px; }
  .box .val { font-size: 56px; font-weight: 800; letter-spacing: -1px; }
  .box.boeing .val { color: #6fa8ff; }
  .box.nvidia .val { color: #ff6f6f; }
  .box .desc { margin-top: 14px; font-size: 20px; color: #a7b0b7; line-height: 1.5; }
  .quote {
    padding: 30px 34px;
    background: rgba(111,168,255,0.06);
    border-left: 4px solid #9db4cc;
    border-radius: 12px;
    font-size: 26px;
    line-height: 1.65;
    color: #d6dbde;
  }
  .quote b { color: #b9c8d6; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">특징주 · 9.28</div>
    <h2>보잉은 급락, 엔비디아는 나홀로 강세 — 온도차 뚜렷</h2>
    <div class="compare">
      <div class="box boeing">
        <div class="lbl">보잉</div>
        <div class="val">-6.9%</div>
        <div class="desc">다우 하락 주도</div>
      </div>
      <div class="box nvidia">
        <div class="lbl">엔비디아</div>
        <div class="val">+1.7%</div>
        <div class="desc">자사주 매입 발표</div>
      </div>
    </div>
    <div class="quote">FAA가 737 MAX 10 소프트웨어 결함 재평가 전까지 인증을 보류하며 보잉이 급락한 반면, 엔비디아는 <b>약 150억 달러 규모 자사주 매입</b> 소식 하나로 시장 전체가 빠진 날에도 나홀로 방어했어요.</div>
  </div>
</body>
</html>
