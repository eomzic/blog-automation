<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #17181a;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 60px;
    background: linear-gradient(150deg, #1c1d1f 0%, #33373b 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #9db4cc;
    background: rgba(111,168,255,0.12);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 40px;
    font-weight: 800;
    color: #f3f5f6;
    letter-spacing: -1px;
    line-height: 1.3;
    margin-bottom: 36px;
  }
  .list { display: flex; flex-direction: column; gap: 16px; }
  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 28px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
  }
  .item .nm { font-size: 26px; font-weight: 700; color: #e7ebed; }
  .item .vv { font-size: 27px; font-weight: 600; color: #a7b0b7; }
  .item .pc { font-size: 30px; font-weight: 800; margin-left: 18px; }
  .item .pc.down { color: #6fa8ff; }
  .item .pc.up { color: #ff6f6f; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">시장 지표 · 9.28</div>
    <h2>안전자산도 요동친 하루 — 금값 급락, VIX 급등</h2>
    <div class="list">
      <div class="item">
        <span class="nm">금현물</span>
        <span><span class="vv">4,115.50달러</span><span class="pc down">-3.94%</span></span>
      </div>
      <div class="item">
        <span class="nm">금선물</span>
        <span><span class="vv">4,168.40달러</span><span class="pc down">-3.5%</span></span>
      </div>
      <div class="item">
        <span class="nm">달러인덱스</span>
        <span><span class="vv">100.855</span><span class="pc up">+0.17%</span></span>
      </div>
      <div class="item">
        <span class="nm">원/달러 환율</span>
        <span><span class="vv">1,359.71원</span><span class="pc up">+4.43원</span></span>
      </div>
      <div class="item">
        <span class="nm">VIX(변동성지수)</span>
        <span><span class="vv">16.07</span><span class="pc up">+8.07%</span></span>
      </div>
    </div>
  </div>
</body>
</html>
