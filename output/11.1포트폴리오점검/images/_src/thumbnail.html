<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 1080px; height: 1080px;
    font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  }
  .card {
    width: 1080px; height: 1080px;
    background: linear-gradient(150deg, #1a1a2e 0%, #1c1f3a 50%, #16213e 100%);
    color: #fff;
    position: relative;
    padding: 90px 90px 100px;
    display: flex;
    flex-direction: column;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 26px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.16);
    background: rgba(255,255,255,0.05);
    font-size: 23px;
    font-weight: 700;
    color: rgba(255,255,255,0.8);
    width: fit-content;
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #5ad1c9; }

  .title {
    margin-top: 56px;
    font-size: 60px;
    font-weight: 800;
    line-height: 1.34;
    letter-spacing: -1px;
  }
  .title .hl { color: #5ad1c9; }

  .subtitle {
    margin-top: 24px;
    font-size: 26px;
    font-weight: 500;
    color: rgba(255,255,255,0.5);
  }

  .stat-row {
    margin-top: 110px;
    display: flex;
    align-items: baseline;
    gap: 26px;
  }
  .stat-row .prev {
    font-size: 34px;
    font-weight: 700;
    color: rgba(255,255,255,0.4);
    text-decoration: line-through;
  }
  .stat-row .arrow { font-size: 30px; color: rgba(255,255,255,0.35); }
  .stat-row .now {
    font-size: 88px;
    font-weight: 800;
    letter-spacing: -2px;
    color: #7c93ef;
  }

  .footer {
    position: absolute;
    bottom: 70px;
    left: 90px;
    right: 90px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer .brand {
    display: flex; align-items: center; gap: 12px;
    font-size: 22px; font-weight: 700; color: rgba(255,255,255,0.55);
  }
  .footer .brand .line { width: 26px; height: 2px; background: rgba(255,255,255,0.4); }
  .footer .meta { font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.35); }
</style>
</head>
<body>
  <div class="card">
    <div class="badge"><span class="dot"></span>포트폴리오 점검 · 11/1</div>

    <div class="title">전종목 급락인데<br><span class="hl">손실률은 줄었어요</span></div>
    <div class="subtitle">아마존 Leo 발표發 스페이스주 쇼크 속 6종목 점검</div>

    <div class="stat-row">
      <span class="prev">-49.6%</span>
      <span class="arrow">→</span>
      <span class="now">-48.5%</span>
    </div>

    <div class="footer">
      <div class="brand"><span class="line"></span>내일도 주린이</div>
      <div class="meta">실보유 6종목</div>
    </div>
  </div>
</body>
</html>
