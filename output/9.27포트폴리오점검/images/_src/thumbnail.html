<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 1080px; height: 1080px;
    font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  }
  .canvas {
    width: 1080px; height: 1080px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
  }
  .glow {
    position: absolute;
    bottom: -260px; left: 50%;
    transform: translateX(-50%);
    width: 820px; height: 560px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(140,160,255,0.14) 0%, rgba(140,160,255,0) 72%);
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    padding: 76px 84px 64px;
  }

  .badge {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 23px;
    font-weight: 600;
    color: #b9c4e0;
    letter-spacing: -0.2px;
  }
  .badge .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #8fa8ff;
  }
  .badge .date { color: rgba(255,255,255,0.42); font-weight: 500; margin-left: 4px; }

  .center {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .eyebrow {
    font-size: 27px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  .giant {
    font-size: 168px;
    font-weight: 800;
    letter-spacing: -4px;
    line-height: 1;
    background: linear-gradient(135deg, #dbe6ff 0%, #86a6f5 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub {
    margin-top: 30px;
    font-size: 30px;
    font-weight: 600;
    color: rgba(255,255,255,0.68);
    letter-spacing: -0.3px;
    line-height: 1.5;
  }

  .chips {
    margin-top: 40px;
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: rgba(0,0,0,0.18);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 16px 30px;
  }
  .chips .prev {
    font-size: 23px;
    font-weight: 600;
    color: rgba(255,255,255,0.42);
  }
  .chips .arrow {
    font-size: 20px;
    color: rgba(255,255,255,0.3);
  }
  .chips .now {
    font-size: 25px;
    font-weight: 800;
    color: #a9c0ff;
  }

  .footer {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .footer .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 26px;
    font-weight: 700;
    color: rgba(255,255,255,0.85);
  }
  .footer .brand .bar {
    width: 26px; height: 3px; background: #8fa8ff;
  }
  .footer .tag {
    font-size: 22px;
    color: rgba(255,255,255,0.36);
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="content">
      <div class="badge">
        <span class="dot"></span>
        포트폴리오 점검
        <span class="date">9.27</span>
      </div>

      <div class="center">
        <div class="eyebrow">추석 연휴 겹친 마감일, 실보유 6종목 결산</div>
        <div class="giant">-38.1%</div>
        <div class="sub">여전히 크게 물려있지만<br>절반은 당일 기준 플러스였다</div>
        <div class="chips">
          <span class="prev">9/18 -39.7%</span>
          <span class="arrow">→</span>
          <span class="now">9/27 -38.1%</span>
        </div>
      </div>

      <div class="footer">
        <div class="brand"><span class="bar"></span>내일도 주린이</div>
        <div class="tag">국내 2종목 · 미국 4종목</div>
      </div>
    </div>
  </div>
</body>
</html>
