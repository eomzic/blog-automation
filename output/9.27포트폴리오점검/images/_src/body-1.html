<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif; }
  .card {
    width: 1000px;
    background: linear-gradient(160deg, #1a1e33 0%, #202849 100%);
    padding: 54px 58px 50px;
    color: #fff;
  }
  .head { margin-bottom: 30px; }
  .head .eyebrow {
    font-size: 20px; font-weight: 700; color: #a9c0ff;
    margin-bottom: 10px;
    letter-spacing: -0.2px;
  }
  .head h2 { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; }

  table {
    width: 100%;
    border-collapse: collapse;
    border-radius: 16px;
    overflow: hidden;
  }
  thead tr { background: rgba(255,255,255,0.06); }
  th {
    text-align: left;
    font-size: 19px;
    font-weight: 600;
    color: rgba(255,255,255,0.55);
    padding: 18px 20px;
  }
  th.num, td.num { text-align: right; }
  tbody tr {
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  td {
    padding: 26px 20px;
    font-size: 22px;
    font-weight: 600;
  }
  td.name { font-weight: 700; font-size: 24px; }
  td .prev { color: rgba(255,255,255,0.45); font-weight: 500; font-size: 18px; display: block; margin-top: 4px;}
  td.pct { font-weight: 800; font-size: 25px; }
  .up { color: #ff8080; }
  .loss { color: #8fa8ff; }
  .loss .rate { font-size: 18px; font-weight: 600; opacity: 0.85; display: block; margin-top: 4px; }

  .foot {
    margin-top: 30px;
    font-size: 21px; line-height: 1.6;
    color: rgba(255,255,255,0.68);
    font-weight: 500;
  }
  .foot b { color: #a9c0ff; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="eyebrow">국내 2종목 · 9/23(수) 마감가 기준</div>
      <h2>삼성전자·두산로보틱스 평가손익</h2>
    </div>

    <table>
      <thead>
        <tr>
          <th>종목</th>
          <th class="num">마감가</th>
          <th class="num">당일등락</th>
          <th class="num">평가손익</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="name">삼성전자<span class="prev">25주 · 평단 371,500원</span></td>
          <td class="num">286,500원</td>
          <td class="num pct up">+3.62%</td>
          <td class="num pct loss">-2,125,000원<span class="rate">-22.9%</span></td>
        </tr>
        <tr>
          <td class="name">두산로보틱스<span class="prev">34주 · 평단 134,674원</span></td>
          <td class="num">71,400원</td>
          <td class="num pct up">+0.56%</td>
          <td class="num pct loss">-2,151,316원<span class="rate">-47.0%</span></td>
        </tr>
      </tbody>
    </table>

    <div class="foot">
      추석 연휴로 다음 개장일은 <b>9/28(월)</b>이라, 두 종목 다 9/23 마감가가 그대로 걸려 있는 상태예요.
    </div>
  </div>
</body>
</html>
