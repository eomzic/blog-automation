<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #0c1615;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 60px;
    background: linear-gradient(150deg, #101b1a 0%, #1c3330 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #2dd4bf;
    background: rgba(45,212,191,0.12);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 42px;
    font-weight: 800;
    color: #f2faf8;
    letter-spacing: -1px;
    line-height: 1.3;
    margin-bottom: 16px;
  }
  .sub {
    font-size: 25px;
    color: #a9cbc2;
    margin-bottom: 36px;
  }
  .hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 30px 36px;
    background: rgba(255,123,123,0.10);
    border: 1px solid rgba(255,123,123,0.32);
    border-radius: 20px;
    margin-bottom: 28px;
  }
  .hero .l1 { font-size: 30px; font-weight: 800; color: #ffe1e1; }
  .hero .l2 { font-size: 25px; font-weight: 600; color: #ffb3b3; margin-top: 6px; }
  .hero .badge2 {
    font-size: 22px;
    font-weight: 700;
    color: #1c3330;
    background: #ff9d9d;
    padding: 10px 20px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .stock {
    padding: 24px 22px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
  }
  .stock .nm { font-size: 23px; font-weight: 700; color: #dceee9; margin-bottom: 10px; }
  .stock .pc { font-size: 30px; font-weight: 800; }
  .stock .why { font-size: 18px; color: #8fb0a8; margin-top: 8px; line-height: 1.4; }
  .up { color: #ff7b7b; }
  .down { color: #6fb3ff; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">IT·반도체 · 9.25 마감</div>
    <h2>IT/기술업종 +3.1% — 오늘 최대 상승 섹터</h2>
    <div class="sub">국채금리·달러 반등 속에도 반도체 우량주로 자금이 몰렸어요</div>
    <div class="hero">
      <div>
        <div class="l1">AMD, 52주 신고가</div>
        <div class="l2">"가장 안전한 성장주 피난처"로 매수세 유입</div>
      </div>
      <div class="badge2">신고가</div>
    </div>
    <div class="grid">
      <div class="stock">
        <div class="nm">마이크로소프트</div>
        <div class="pc up">+3.66%</div>
        <div class="why">코파일럿 신기능 공개</div>
      </div>
      <div class="stock">
        <div class="nm">델</div>
        <div class="pc up">+5.01%</div>
        <div class="why">-</div>
      </div>
      <div class="stock">
        <div class="nm">아카마이</div>
        <div class="pc up">+3.20%</div>
        <div class="why">앤스로픽과 116억달러 클라우드 계약</div>
      </div>
      <div class="stock">
        <div class="nm">퀄컴</div>
        <div class="pc up">+3.39%</div>
        <div class="why">-</div>
      </div>
      <div class="stock">
        <div class="nm">애플</div>
        <div class="pc up">+1.53%</div>
        <div class="why">-</div>
      </div>
      <div class="stock">
        <div class="nm">엔비디아</div>
        <div class="pc up">+0.22%</div>
        <div class="why">대형주 중 상대적 선방</div>
      </div>
    </div>
  </div>
</body>
</html>
