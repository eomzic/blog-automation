<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #0c1615;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 60px;
    background: linear-gradient(150deg, #101b1a 0%, #1c3330 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #2dd4bf;
    background: rgba(45,212,191,0.12);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 42px;
    font-weight: 800;
    color: #f2faf8;
    letter-spacing: -1px;
    line-height: 1.3;
    margin-bottom: 36px;
  }
  .list { display: flex; flex-direction: column; gap: 18px; }
  .item {
    display: flex;
    gap: 22px;
    padding: 26px 28px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    align-items: flex-start;
  }
  .item .ico {
    flex: none;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(45,212,191,0.14);
    color: #5eead4;
    font-size: 24px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .item .body-t { font-size: 27px; font-weight: 700; color: #eef8f5; margin-bottom: 6px; }
  .item .body-d { font-size: 22px; color: #a9cbc2; line-height: 1.5; }
  .item .body-d b { color: #ff9d9d; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">체크포인트 · 9.25</div>
    <h2>지수는 웃었지만, 잔잔한 경고음도 있었다</h2>
    <div class="list">
      <div class="item">
        <div class="ico">1</div>
        <div>
          <div class="body-t">은행주 약세</div>
          <div class="body-d">BofA "AI 에이전트發 현금관리 개선이 <b>은행 마진 압축 위험</b>으로 작용" 평가</div>
        </div>
      </div>
      <div class="item">
        <div class="ico">2</div>
        <div>
          <div class="body-t">미·중 무역휴전 2개월 추가 연장</div>
          <div class="body-d">시진핑 주석 백악관 방문 마무리, 세부 내용은 월요일(9/28) 공개 예정</div>
        </div>
      </div>
      <div class="item">
        <div class="ico">3</div>
        <div>
          <div class="body-t">소비자심리 4개월래 최저</div>
          <div class="body-d">미시간대 9월 최종치 48.1, 8월(51.7) 대비 하락</div>
        </div>
      </div>
      <div class="item">
        <div class="ico">4</div>
        <div>
          <div class="body-t">나이키, 투자의견 하향</div>
          <div class="body-d">BofA "언더퍼폼"으로 강등, 목표주가 30달러</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
