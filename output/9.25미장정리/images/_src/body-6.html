<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #0c1615;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 60px;
    background: linear-gradient(150deg, #101b1a 0%, #1c3330 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #2dd4bf;
    background: rgba(45,212,191,0.12);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 40px;
    font-weight: 800;
    color: #f2faf8;
    letter-spacing: -1px;
    line-height: 1.32;
    margin-bottom: 40px;
  }
  .quote-block {
    padding: 34px 36px;
    background: rgba(45,212,191,0.07);
    border: 1px solid rgba(45,212,191,0.24);
    border-radius: 20px;
    margin-bottom: 22px;
  }
  .quote-block .mark { font-size: 44px; color: #2dd4bf; font-weight: 800; line-height: 0.5; margin-bottom: 14px; }
  .quote-block .txt { font-size: 27px; line-height: 1.6; color: #e7f3f0; font-weight: 600; margin-bottom: 14px; }
  .quote-block .who { font-size: 22px; color: #8fb0a8; font-weight: 600; }
  .quote-block.alt {
    background: rgba(255,123,123,0.07);
    border-color: rgba(255,123,123,0.24);
  }
  .quote-block.alt .mark { color: #ff9d9d; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">전망 · 9.25</div>
    <h2>"유가 덕분에 금리를 무시할 수 있었다"</h2>
    <div class="quote-block">
      <div class="mark">"</div>
      <div class="txt">유가 하락 덕분에 장기 금리 상승을 무시할 수 있었다. 10월에도 10년물 금리가 5% 위에 머문다면 역풍이 더 강해질 것.</div>
      <div class="who">— 매트 맬리, 밀러타박 수석전략가</div>
    </div>
    <div class="quote-block alt">
      <div class="mark">"</div>
      <div class="txt">최근 채권 급락은 위기는 아니지만, 주목할 만한 신호다.</div>
      <div class="who">— 릭 리더, 블랙록</div>
    </div>
  </div>
</body>
</html>
