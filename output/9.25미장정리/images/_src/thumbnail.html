<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Pretendard';
    src: local('Apple SD Gothic Neo');
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1080px;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', -apple-system, sans-serif;
    overflow: hidden;
  }
  .canvas {
    position: relative;
    width: 1080px; height: 1080px;
    background: linear-gradient(135deg, #0f2027 0%, #134e4a 100%);
    overflow: hidden;
  }
  .glow1 {
    position: absolute;
    top: -220px; right: -160px;
    width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(45,212,191,0.22) 0%, rgba(45,212,191,0) 70%);
  }
  .glow2 {
    position: absolute;
    bottom: -260px; left: -200px;
    width: 680px; height: 680px;
    background: radial-gradient(circle, rgba(16,185,129,0.16) 0%, rgba(16,185,129,0) 70%);
  }

  .badge {
    position: absolute;
    top: 84px; left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 26px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #2dd4bf;
  }
  .badge span {
    font-size: 27px;
    font-weight: 600;
    color: #d3ece7;
    letter-spacing: -0.3px;
  }
  .badge .date { color: #8fb8b0; margin-left: 4px; }

  .content {
    position: absolute;
    top: 300px; left: 0; right: 0;
    text-align: center;
  }
  .eyebrow {
    font-size: 30px;
    font-weight: 600;
    color: #8fb8b0;
    margin-bottom: 22px;
    letter-spacing: -0.3px;
  }
  .title {
    font-size: 90px;
    font-weight: 800;
    line-height: 1.24;
    letter-spacing: -1.5px;
    color: #f2faf8;
  }
  .title .accent {
    background: linear-gradient(90deg, #5eead4, #2dd4bf);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .stat-line {
    margin-top: 38px;
    font-size: 30px;
    font-weight: 500;
    color: #b9d6cf;
    letter-spacing: -0.3px;
  }
  .stat-line .up { color: #ff7b7b; font-weight: 700; }

  .chips {
    position: absolute;
    top: 760px; left: 96px; right: 96px;
    display: flex;
    gap: 20px;
  }
  .chip {
    flex: 1;
    padding: 26px 20px;
    background: rgba(0,0,0,0.22);
    border: 1px solid rgba(45,212,191,0.28);
    border-radius: 20px;
    text-align: center;
  }
  .chip .idx {
    font-size: 23px;
    font-weight: 600;
    color: #9fc4bc;
    margin-bottom: 10px;
  }
  .chip .pct {
    font-size: 40px;
    font-weight: 800;
    color: #ff7b7b;
    letter-spacing: -1px;
  }

  .footer {
    position: absolute;
    bottom: 96px; left: 96px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .footer .bar {
    width: 34px; height: 4px;
    background: #2dd4bf;
    border-radius: 2px;
  }
  .footer .name {
    font-size: 27px;
    font-weight: 700;
    color: #dff2ee;
    letter-spacing: -0.3px;
  }
  .footer2 {
    position: absolute;
    bottom: 100px; right: 96px;
    font-size: 24px;
    font-weight: 600;
    color: #8fb8b0;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow1"></div>
    <div class="glow2"></div>

    <div class="badge">
      <div class="dot"></div>
      <span>미장정리 · 시황<span class="date">  9.25</span></span>
    </div>

    <div class="content">
      <div class="eyebrow">오랜만에 파란불 제로</div>
      <div class="title">
        3대 지수<br>
        <span class="accent">전원 상승 마감</span>
      </div>
      <div class="stat-line">
        다우 <span class="up">+0.93%</span> · S&P500 <span class="up">+0.51%</span> · 나스닥 <span class="up">+0.48%</span>
      </div>
    </div>

    <div class="chips">
      <div class="chip">
        <div class="idx">다우존스</div>
        <div class="pct">+0.93%</div>
      </div>
      <div class="chip">
        <div class="idx">S&amp;P500</div>
        <div class="pct">+0.51%</div>
      </div>
      <div class="chip">
        <div class="idx">나스닥</div>
        <div class="pct">+0.48%</div>
      </div>
    </div>

    <div class="footer">
      <div class="bar"></div>
      <div class="name">내일도 주린이</div>
    </div>
    <div class="footer2">유가 급락이 살렸다</div>
  </div>
</body>
</html>
