<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #0a1614;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 60px;
    background: linear-gradient(150deg, #0f2027 0%, #16332e 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #5eead4;
    background: rgba(94,234,212,0.13);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 42px;
    font-weight: 800;
    color: #f2faf7;
    letter-spacing: -1px;
    line-height: 1.3;
    margin-bottom: 36px;
  }
  .grid {
    display: flex;
    gap: 24px;
  }
  .box {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 36px 34px;
  }
  .box .idx {
    font-size: 26px;
    font-weight: 700;
    color: #cdeee7;
    margin-bottom: 20px;
  }
  .box .range {
    font-size: 24px;
    color: #82a89e;
    margin-bottom: 14px;
  }
  .box .range b { color: #eafaf5; font-weight: 700; }
  .box .pct {
    font-size: 54px;
    font-weight: 800;
    letter-spacing: -1.5px;
  }
  .up { color: #ff6b6b; }
  .down { color: #6ea8ff; }
  .note {
    margin-top: 34px;
    font-size: 24px;
    color: #9fc4b9;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">이틀 비교 · 지수 마감</div>
    <h2>코스피·코스닥, 낙폭 줄이고 반등 갈렸다</h2>
    <div class="grid">
      <div class="box">
        <div class="idx">코스피</div>
        <div class="range">9/28 <b>6,889.74</b> → 9/29 <b>6,870.81</b></div>
        <div class="pct down">-0.27%</div>
      </div>
      <div class="box">
        <div class="idx">코스닥</div>
        <div class="range">9/28 <b>846.58</b> → 9/29 <b>849.80</b></div>
        <div class="pct up">+0.38%</div>
      </div>
    </div>
    <div class="note">코스피는 장중 6,782.99까지 밀렸다 저가 매수세에 낙폭 축소, 코스닥은 개인 순매수 힘입어 플러스 마감</div>
  </div>
</body>
</html>
