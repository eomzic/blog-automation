<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1080px;
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 1080px;
    height: 1080px;
    background: linear-gradient(155deg, #0f2027 0%, #14342f 55%, #134e4a 100%);
  }
  .glow {
    position: absolute;
    top: -180px;
    right: -160px;
    width: 560px;
    height: 560px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(94,234,212,0.30) 0%, rgba(94,234,212,0.08) 45%, rgba(94,234,212,0) 70%);
  }
  .glow2 {
    position: absolute;
    bottom: -220px;
    left: -140px;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(20,80,70,0.55) 0%, rgba(20,80,70,0) 70%);
  }
  .badge {
    position: absolute;
    top: 92px;
    left: 96px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 26px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(94,234,212,0.35);
    border-radius: 999px;
    font-size: 26px;
    font-weight: 600;
    color: #cdeee7;
    letter-spacing: -0.2px;
  }
  .badge .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #5eead4;
  }
  .badge .date {
    color: #7fa89e;
    font-weight: 500;
  }
  .content {
    position: absolute;
    top: 300px;
    left: 96px;
    right: 96px;
  }
  .eyebrow {
    font-size: 28px;
    font-weight: 500;
    color: #8fc9bc;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h1 {
    font-size: 82px;
    font-weight: 800;
    color: #f4fbf9;
    line-height: 1.28;
    letter-spacing: -2px;
  }
  .stats {
    position: absolute;
    top: 660px;
    left: 96px;
    right: 96px;
    display: flex;
    gap: 18px;
  }
  .stat {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 18px;
    padding: 24px 22px;
  }
  .stat .label {
    font-size: 22px;
    color: #93b8ae;
    font-weight: 500;
    margin-bottom: 10px;
  }
  .stat .val {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -1px;
  }
  .up { color: #ff6b6b; }
  .down { color: #6ea8ff; }
  .footer {
    position: absolute;
    bottom: 84px;
    left: 96px;
    right: 96px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 30px;
    font-weight: 700;
    color: #eafaf5;
  }
  .brand .bar {
    width: 34px;
    height: 4px;
    background: #5eead4;
    border-radius: 2px;
  }
  .idx {
    text-align: right;
  }
  .idx .l {
    font-size: 22px;
    color: #93b8ae;
    margin-bottom: 6px;
  }
  .idx .v {
    font-size: 32px;
    font-weight: 700;
    color: #f4fbf9;
    letter-spacing: -0.5px;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="badge"><span class="dot"></span>국장정리 · 시황 <span class="date">9.29</span></div>
    <div class="content">
      <div class="eyebrow">어제 -2.70% 급락 이후</div>
      <h1>낙폭 축소,<br>숨 돌린 하루</h1>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="label">코스피</div>
        <div class="val down">-0.27%</div>
      </div>
      <div class="stat">
        <div class="label">코스닥</div>
        <div class="val up">+0.38%</div>
      </div>
      <div class="stat">
        <div class="label">삼성전자</div>
        <div class="val up">+0.93%</div>
      </div>
    </div>
    <div class="footer">
      <div class="brand"><span class="bar"></span>내일도 주린이</div>
      <div class="idx">
        <div class="l">코스피 종가</div>
        <div class="v">6,870.81</div>
      </div>
    </div>
  </div>
</body>
</html>
