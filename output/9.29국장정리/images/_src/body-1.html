<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #0a1614;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 56px;
    background: linear-gradient(150deg, #0f2027 0%, #16332e 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #5eead4;
    background: rgba(94,234,212,0.13);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 42px;
    font-weight: 800;
    color: #f2faf7;
    letter-spacing: -1px;
    line-height: 1.3;
    margin-bottom: 36px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    text-align: left;
    font-size: 24px;
    font-weight: 600;
    color: #82a89e;
    padding: 0 0 18px;
    border-bottom: 2px solid rgba(255,255,255,0.12);
  }
  thead th:not(:first-child), tbody td:not(:first-child) {
    text-align: right;
  }
  tbody td {
    font-size: 32px;
    font-weight: 700;
    color: #eafaf5;
    padding: 26px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  tbody tr:last-child td { border-bottom: none; }
  .name { font-weight: 700; color: #eafaf5; display: flex; align-items: center; gap: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.s { background: #5eead4; }
  .dot.h { background: #a7f3d0; }
  .up { color: #ff6b6b; }
  .down { color: #6ea8ff; }
  .note {
    margin-top: 34px;
    font-size: 24px;
    color: #9fc4b9;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">이틀 비교 · 반도체 대장주</div>
    <h2>삼성전자 반등, SK하이닉스는 숨 고르기</h2>
    <table>
      <thead>
        <tr><th>종목</th><th>9/28</th><th>9/29</th><th>9/29 종가</th></tr>
      </thead>
      <tbody>
        <tr>
          <td class="name"><span class="dot s"></span>삼성전자</td>
          <td class="down">-5.43%</td>
          <td class="up">+0.93%</td>
          <td>272,500원</td>
        </tr>
        <tr>
          <td class="name"><span class="dot h"></span>SK하이닉스</td>
          <td class="down">-5.05%</td>
          <td class="down">-0.17%</td>
          <td>1,765,000원</td>
        </tr>
      </tbody>
    </table>
    <div class="note">삼성전자는 저가 매수세 + 엔비디아 자사주 매입 확대에 반등, SK하이닉스는 목표주가 하향 여파로 약보합</div>
  </div>
</body>
</html>
