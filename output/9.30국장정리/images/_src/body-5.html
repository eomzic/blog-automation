<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #1a1b1c;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 56px;
    background: linear-gradient(150deg, #232526 0%, #303234 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #f5c451;
    background: rgba(245,196,81,0.14);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 40px;
    font-weight: 800;
    color: #f7f7f5;
    letter-spacing: -1px;
    line-height: 1.3;
    margin-bottom: 40px;
  }
  .cols { display: flex; gap: 26px; }
  .col { flex: 1; }
  .col .ch {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .col.strong .ch { color: #ff8f8f; }
  .col.weak .ch { color: #8fb8ff; }
  .col .ch .dot { width: 9px; height: 9px; border-radius: 50%; }
  .col.strong .ch .dot { background: #ff6b6b; }
  .col.weak .ch .dot { background: #6ea8ff; }
  .item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 18px 22px;
    margin-bottom: 14px;
    font-size: 24px;
    font-weight: 600;
    color: #eeeeec;
  }
  .item .v { font-weight: 800; font-size: 25px; }
  .strong .item .v { color: #ff6b6b; }
  .weak .item .v { color: #6ea8ff; }
  .note {
    margin-top: 30px;
    font-size: 24px;
    color: #adb0b1;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">업종·종목 온도차</div>
    <h2>철강·자동차부품은 웃고, 보험·금융은 울었다</h2>
    <div class="cols">
      <div class="col strong">
        <div class="ch"><span class="dot"></span>강세</div>
        <div class="item"><span>하이스틸</span><span class="v">+15.33%</span></div>
        <div class="item"><span>한온시스템</span><span class="v">+8.75%</span></div>
        <div class="item"><span>넥스틸</span><span class="v">+8.64%</span></div>
        <div class="item"><span>삼성중공업</span><span class="v">+2.69%</span></div>
      </div>
      <div class="col weak">
        <div class="ch"><span class="dot"></span>약세</div>
        <div class="item"><span>한화생명</span><span class="v">-7.03%</span></div>
        <div class="item"><span>우리금융지주</span><span class="v">-4.53%</span></div>
        <div class="item"><span>신한지주</span><span class="v">-3.98%</span></div>
        <div class="item"><span>삼성생명</span><span class="v">-2.93%</span></div>
      </div>
    </div>
    <div class="note">반도체·금리 이슈에 가려졌지만 철강·소재·자동차부품·조선·건설이 웃는 동안 보험·금융은 유독 고전 — 업종 순환은 오늘도 계속됐다</div>
  </div>
</body>
</html>
