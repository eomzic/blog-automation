<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #1a1b1c;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 56px;
    background: linear-gradient(150deg, #232526 0%, #303234 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #f5c451;
    background: rgba(245,196,81,0.14);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 40px;
    font-weight: 800;
    color: #f7f7f5;
    letter-spacing: -1px;
    line-height: 1.3;
    margin-bottom: 36px;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 23px;
    font-weight: 600;
    color: #9a9d9f;
    padding: 0 0 18px;
    border-bottom: 2px solid rgba(255,255,255,0.12);
  }
  thead th:not(:first-child), tbody td:not(:first-child) { text-align: right; }
  tbody td {
    font-size: 30px;
    font-weight: 700;
    color: #eeeeec;
    padding: 26px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  tbody tr:last-child td { border-bottom: none; }
  .name { font-weight: 700; color: #eeeeec; display: flex; align-items: center; gap: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.s { background: #f5c451; }
  .dot.h { background: #6ea8ff; }
  .up { color: #ff6b6b; }
  .down { color: #6ea8ff; }
  .note {
    margin-top: 34px;
    font-size: 24px;
    color: #adb0b1;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">반도체 대장주 · 장중 vs 마감</div>
    <h2>오전엔 같이 웃었는데, 마감은 엇갈렸다</h2>
    <table>
      <thead>
        <tr><th>종목</th><th>장중(오전)</th><th>마감</th><th>종가</th></tr>
      </thead>
      <tbody>
        <tr>
          <td class="name"><span class="dot s"></span>삼성전자</td>
          <td class="up">+0.73%</td>
          <td class="down">-1.1%</td>
          <td>269,500원</td>
        </tr>
        <tr>
          <td class="name"><span class="dot h"></span>SK하이닉스</td>
          <td class="up">+1.42%</td>
          <td class="up">+0.62%</td>
          <td>1,784,000원</td>
        </tr>
      </tbody>
    </table>
    <div class="note">25주 보유 중인 삼성전자는 오전 +0.73%까지 올랐다가 마감엔 마이너스로 내려앉아 아쉬웠던 하루. SK하이닉스가 반도체 대형주 중 홀로 플러스를 지켜냈다</div>
  </div>
</body>
</html>
