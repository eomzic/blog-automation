<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #0e0e1c;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 60px;
    background: linear-gradient(150deg, #1a1a2e 0%, #1d2550 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #a78bfa;
    background: rgba(167,139,250,0.14);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 40px;
    font-weight: 800;
    color: #f6f5fb;
    letter-spacing: -1px;
    line-height: 1.35;
    margin-bottom: 48px;
  }
  .steps {
    display: flex;
    align-items: flex-end;
    gap: 14px;
  }
  .step {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .step .barbox {
    width: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    height: 180px;
  }
  .step .bar {
    width: 64px;
    border-radius: 10px 10px 0 0;
    background: linear-gradient(180deg, rgba(110,168,255,0.5) 0%, rgba(110,168,255,0.85) 100%);
  }
  .step.final .bar {
    background: linear-gradient(180deg, #8fb8ff 0%, #6ea8ff 100%);
  }
  .step .lbl {
    margin-top: 18px;
    font-size: 21px;
    color: #a7a9ce;
    font-weight: 600;
  }
  .step .val {
    margin-top: 8px;
    font-size: 22px;
    font-weight: 700;
    color: #cdd2f0;
  }
  .step.final .val {
    font-size: 26px;
    font-weight: 800;
    color: #6ea8ff;
  }
  .arrow {
    font-size: 26px;
    color: #a7a9ce;
    padding-bottom: 62px;
  }
  .stats {
    display: flex;
    gap: 20px;
    margin-top: 44px;
  }
  .mini {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 20px 22px;
  }
  .mini .k { font-size: 20px; color: #a7a9ce; margin-bottom: 8px; }
  .mini .v { font-size: 26px; font-weight: 800; color: #eceaf6; }
  .note {
    margin-top: 32px;
    font-size: 23px;
    color: #a7a9ce;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">신규 실업수당 청구 · 4주 추이</div>
    <h2>4주 연속 감소, 57년 만의 최저권 근접</h2>
    <div class="steps">
      <div class="step">
        <div class="barbox"><div class="bar" style="height:170px"></div></div>
        <div class="lbl">4주 전</div>
        <div class="val">감소세 시작</div>
      </div>
      <div class="arrow">→</div>
      <div class="step">
        <div class="barbox"><div class="bar" style="height:140px"></div></div>
        <div class="lbl">3주 전</div>
        <div class="val">감소 지속</div>
      </div>
      <div class="arrow">→</div>
      <div class="step">
        <div class="barbox"><div class="bar" style="height:112px"></div></div>
        <div class="lbl">2주 전</div>
        <div class="val">감소 지속</div>
      </div>
      <div class="arrow">→</div>
      <div class="step final">
        <div class="barbox"><div class="bar" style="height:84px"></div></div>
        <div class="lbl">이번 주</div>
        <div class="val">19.7만 건</div>
      </div>
    </div>
    <div class="stats">
      <div class="mini"><div class="k">신규 청구</div><div class="v">19만 7,000건</div></div>
      <div class="mini"><div class="k">9월 감원</div><div class="v">전년比 -18%</div></div>
      <div class="mini"><div class="k">민간 고용</div><div class="v">+9만 명</div></div>
    </div>
    <div class="note">기업들이 사람을 덜 자른다는 신호지만, 연준이 금리를 높게 유지할 여력을 준다는 해석도 함께 붙었다</div>
  </div>
</body>
</html>
