<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif; }
  .card {
    width: 1000px;
    background: linear-gradient(160deg, #241330 0%, #32184a 100%);
    padding: 54px 58px 50px;
    color: #fff;
  }
  .head { margin-bottom: 40px; }
  .head .eyebrow {
    font-size: 20px; font-weight: 700; color: #c3aef5;
    margin-bottom: 10px;
    letter-spacing: -0.2px;
  }
  .head h2 { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; }

  .steps {
    display: flex;
    align-items: stretch;
  }
  .step {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 22px 10px;
    border-radius: 18px;
  }
  .step.today {
    background: rgba(169,140,240,0.14);
    border: 1px solid rgba(169,140,240,0.4);
  }
  .step .date {
    font-size: 20px;
    font-weight: 700;
    color: rgba(255,255,255,0.55);
    margin-bottom: 4px;
  }
  .step .day {
    font-size: 16px;
    font-weight: 600;
    color: rgba(255,255,255,0.4);
    margin-bottom: 16px;
  }
  .step .dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 3px solid #5a4a7a;
    margin-bottom: 16px;
  }
  .step.closed .dot { border-color: #8fa8ff; }
  .step.open .dot { border-color: #ff8080; }
  .step .status {
    font-size: 19px;
    font-weight: 700;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.6);
  }
  .step.closed .status { color: #9db3ff; background: rgba(143,168,255,0.1); }
  .step.open .status { color: #ff9a9a; background: rgba(255,128,128,0.1); }

  .arrow {
    flex: 0 0 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.2);
    font-size: 24px;
    padding-top: 58px;
  }

  .note {
    margin-top: 36px;
    padding: 24px 28px;
    border-radius: 18px;
    background: rgba(0,0,0,0.18);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 20px;
    line-height: 1.6;
    color: rgba(255,255,255,0.72);
  }
  .note b { color: #d6c8f0; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="eyebrow">국내 증시 개장 캘린더</div>
      <h2>개천절 대체공휴일로 사흘 연속 휴장</h2>
    </div>

    <div class="steps">
      <div class="step closed">
        <div class="date">10/3</div>
        <div class="day">토</div>
        <div class="dot"></div>
        <div class="status">개천절</div>
      </div>
      <div class="arrow">→</div>
      <div class="step closed">
        <div class="date">10/4</div>
        <div class="day">일</div>
        <div class="dot"></div>
        <div class="status">주말 휴장</div>
      </div>
      <div class="arrow">→</div>
      <div class="step closed today">
        <div class="date">10/5</div>
        <div class="day">월 · 오늘</div>
        <div class="dot"></div>
        <div class="status">대체공휴일</div>
      </div>
      <div class="arrow">→</div>
      <div class="step open">
        <div class="date">10/6</div>
        <div class="day">화</div>
        <div class="dot"></div>
        <div class="status">개장(추정)</div>
      </div>
    </div>

    <div class="note">
      국내 마지막 거래일은 <b>10/2(금)</b> — 삼성전자·두산로보틱스는 그날 마감가가 오늘자 수치로 그대로 유지돼요.
    </div>
  </div>
</body>
</html>
