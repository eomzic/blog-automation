<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif; }
  .card {
    width: 1000px;
    background: linear-gradient(155deg, #1e0a3c 0%, #2a1050 55%, #3d1a5c 100%);
    padding: 54px 56px 48px;
    color: #fff;
  }
  .eyebrow { font-size: 20px; font-weight: 700; color: #e8a9ff; margin-bottom: 14px; }
  h2 { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.4; margin-bottom: 36px; }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 18px 16px; text-align: center; font-size: 17px; }
  thead th { color: rgba(255,255,255,0.55); font-weight: 700; font-size: 16px; border-bottom: 1px solid rgba(255,255,255,0.14); }
  tbody td { border-bottom: 1px solid rgba(255,255,255,0.08); font-weight: 600; }
  tbody tr:last-child td { border-bottom: none; }
  td.name { text-align: left; font-weight: 800; font-size: 19px; }
  td.down { color: #7ba4ff; font-weight: 800; }

  .note {
    margin-top: 30px;
    padding: 20px 24px;
    border-radius: 16px;
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 17px;
    line-height: 1.6;
    color: rgba(255,255,255,0.75);
  }
  .note b { color: #e8a9ff; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">국내 보유종목 · 애프터가 기준</div>
    <h2>삼성전자·두산로보틱스는 애프터마켓에서 둘 다 빠졌어요</h2>

    <table>
      <thead>
        <tr><th>종목</th><th>정규장 마감</th><th>애프터가</th><th>당일등락(애프터가)</th></tr>
      </thead>
      <tbody>
        <tr>
          <td class="name">삼성전자</td>
          <td>189,900원 (+0.64%)</td>
          <td>186,300원</td>
          <td class="down">-1.27%</td>
        </tr>
        <tr>
          <td class="name">두산로보틱스</td>
          <td>약 -3.17%</td>
          <td>48,200원</td>
          <td class="down">-4.37%</td>
        </tr>
      </tbody>
    </table>

    <div class="note">
      삼성전자는 정규장(+0.64%)과 애프터마켓(-1.27%) 방향이 서로 반대였고, 두산로보틱스는 정규장·애프터마켓 둘 다 같은 방향(하락)이었어요. 두산로보틱스는 <b>로봇 섹터 전체</b>가 같이 약세였던 걸로 보여요.
    </div>
  </div>
</body>
</html>
