<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif; }
  .card {
    width: 1000px;
    background: linear-gradient(155deg, #1e0a3c 0%, #2a1050 55%, #3d1a5c 100%);
    padding: 54px 56px 48px;
    color: #fff;
  }
  .eyebrow { font-size: 20px; font-weight: 700; color: #e8a9ff; margin-bottom: 14px; }
  h2 { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.4; margin-bottom: 34px; }

  .grid4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
  }
  .box {
    border-radius: 20px;
    padding: 28px 18px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    text-align: center;
  }
  .box .ticker { font-size: 19px; font-weight: 700; color: rgba(255,255,255,0.6); margin-bottom: 14px; }
  .box .pct { font-size: 38px; font-weight: 800; color: #ff6b6b; letter-spacing: -1px; }
  .box .price { margin-top: 10px; font-size: 16px; color: rgba(255,255,255,0.55); }

  .note {
    margin-top: 32px;
    padding: 22px 26px;
    border-radius: 16px;
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 18px;
    line-height: 1.65;
    color: rgba(255,255,255,0.78);
  }
  .note b { color: #e8a9ff; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">미국 보유종목 · 동시 상승</div>
    <h2>오늘 PL·RDW·ORCL·NASA 넷 다 플러스였어요</h2>

    <div class="grid4">
      <div class="box">
        <div class="ticker">PL</div>
        <div class="pct">+3.43%</div>
        <div class="price">현재가 확인 불가</div>
      </div>
      <div class="box">
        <div class="ticker">RDW</div>
        <div class="pct">+4.36%</div>
        <div class="price">$6.46</div>
      </div>
      <div class="box">
        <div class="ticker">ORCL</div>
        <div class="pct">+4.38%</div>
        <div class="price">$120.20</div>
      </div>
      <div class="box">
        <div class="ticker">NASA ETF</div>
        <div class="pct">+3.00%</div>
        <div class="price">$18.22</div>
      </div>
    </div>

    <div class="note">
      공통분모는 <b>스페이스X 기업공개(IPO) 계획</b> 소식이에요. NASA ETF 최대 비중이 "SpaceX" 관련(약 24%)이라 바로 반영됐고, RDW·PL도 같은 우주 섹터 랠리를 같이 탔어요. ORCL은 성격이 조금 달라서, AI 데이터센터 공포로 과하게 빠졌던 주가가 기술적으로 되돌림한 쪽에 가까워요.
    </div>
  </div>
</body>
</html>
