<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width: 1080px; height: 1080px;
    font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  }
  .card {
    width: 1080px; height: 1080px;
    background: linear-gradient(160deg, #1e0a3c 0%, #2a1050 45%, #3d1a5c 100%);
    color: #fff;
    position: relative;
    padding: 80px 90px 70px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 28px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06);
    font-size: 23px;
    font-weight: 700;
    color: rgba(255,255,255,0.82);
  }
  .title {
    margin-top: 44px;
    font-size: 50px;
    font-weight: 800;
    line-height: 1.38;
    letter-spacing: -1px;
    text-align: center;
  }
  .title .hl { color: #e8a9ff; }

  .stat {
    margin-top: 40px;
    text-align: center;
  }
  .stat .num { font-size: 92px; font-weight: 800; color: #7ba4ff; letter-spacing: -2px; }
  .stat .sub { margin-top: 10px; font-size: 24px; color: rgba(255,255,255,0.55); font-weight: 600; }

  .grid {
    margin-top: 52px;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .chip {
    border-radius: 18px;
    padding: 20px 10px;
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(255,255,255,0.12);
    text-align: center;
  }
  .chip .name { font-size: 19px; font-weight: 700; color: rgba(255,255,255,0.65); margin-bottom: 8px; }
  .chip .pct { font-size: 28px; font-weight: 800; }
  .pct.up { color: #ff6b6b; }
  .pct.down { color: #7ba4ff; }

  .footer {
    margin-top: auto;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid rgba(255,255,255,0.12);
    padding-top: 26px;
  }
  .footer .sig { font-size: 26px; font-weight: 700; color: rgba(255,255,255,0.85); }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">📊 포트폴리오 점검</div>
    <div class="title">보유 6종목 오늘은 <span class="hl">반반</span>인데<br>전체 손실은 더 벌어졌어요</div>
    <div class="stat">
      <div class="num">-54.4%</div>
      <div class="sub">평가액 16,560,267원</div>
    </div>
    <div class="grid">
      <div class="chip"><div class="name">삼성전자</div><div class="pct down">-1.27%</div></div>
      <div class="chip"><div class="name">두산로보틱스</div><div class="pct down">-4.37%</div></div>
      <div class="chip"><div class="name">PL</div><div class="pct up">+3.43%</div></div>
      <div class="chip"><div class="name">ORCL</div><div class="pct up">+4.38%</div></div>
      <div class="chip"><div class="name">RDW</div><div class="pct up">+4.36%</div></div>
      <div class="chip"><div class="name">NASA ETF</div><div class="pct up">+3.00%</div></div>
    </div>
    <div class="footer">
      <div class="sig">내일도 주린이</div>
      <div class="sig">11/9</div>
    </div>
  </div>
</body>
</html>
