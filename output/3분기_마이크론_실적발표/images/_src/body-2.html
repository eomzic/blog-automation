<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif; }
  .card {
    width: 1000px;
    background: linear-gradient(160deg, #0c2426 0%, #164f49 100%);
    padding: 54px 58px 50px;
    color: #fff;
  }
  .head { margin-bottom: 34px; }
  .head .eyebrow {
    font-size: 20px; font-weight: 700; color: #7fe3c9;
    margin-bottom: 10px;
    letter-spacing: -0.2px;
  }
  .head h2 { font-size: 29px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.4; }

  table {
    width: 100%;
    border-collapse: collapse;
    border-radius: 20px;
    overflow: hidden;
    background: rgba(0,0,0,0.18);
    border: 1px solid rgba(255,255,255,0.08);
  }
  thead th {
    text-align: left;
    font-size: 19px;
    font-weight: 700;
    color: rgba(255,255,255,0.5);
    padding: 20px 26px;
    background: rgba(255,255,255,0.04);
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  thead th:last-child, tbody td:last-child { text-align: right; }
  tbody td {
    font-size: 23px;
    font-weight: 700;
    padding: 24px 26px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody td.item { color: rgba(255,255,255,0.68); font-weight: 600; font-size: 20px; }
  tbody td.consensus { color: rgba(255,255,255,0.55); font-weight: 600; font-size: 20px; }
  tbody td.surprise { color: #5eead4; font-weight: 800; }

  .footline {
    margin-top: 28px;
    font-size: 19px;
    line-height: 1.65;
    color: rgba(255,255,255,0.65);
  }
  .footline b { color: #a7f3d0; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="eyebrow">매출 542억 3,000만달러 · Non-GAAP EPS 33.42달러</div>
      <h2>컨센서스를 다 뚫은 어닝 서프라이즈</h2>
    </div>

    <table>
      <thead>
        <tr><th>항목</th><th>실제치</th><th>컨센서스</th><th>서프라이즈</th></tr>
      </thead>
      <tbody>
        <tr>
          <td class="item">매출</td>
          <td>542.3억달러</td>
          <td class="consensus">504.5억~513.3억달러</td>
          <td class="surprise">+6~7%</td>
        </tr>
        <tr>
          <td class="item">Non-GAAP EPS</td>
          <td>33.42달러</td>
          <td class="consensus">31.16~31.72달러</td>
          <td class="surprise">+5~6%</td>
        </tr>
        <tr>
          <td class="item">매출총이익률</td>
          <td>87.0%</td>
          <td class="consensus">전분기 대비</td>
          <td class="surprise">+210bp</td>
        </tr>
      </tbody>
    </table>

    <div class="footline">
      컨센서스는 집계 기관마다 편차가 있었지만(EPS 기준 Zacks 31.45 · MarketBeat 31.72 · Alphastreet 31.56달러), <b>어느 기준으로 봐도 실제치가 다 웃돌았다</b>는 결론은 같았어요.
    </div>
  </div>
</body>
</html>
