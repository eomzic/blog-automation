<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #120f1a;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 56px;
    background: linear-gradient(150deg, #0f2027 0%, #1c2740 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #c4b5fd;
    background: rgba(167,139,250,0.14);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 40px;
    font-weight: 800;
    color: #f2faf7;
    letter-spacing: -1px;
    line-height: 1.3;
    margin-bottom: 44px;
  }
  .chartwrap { position: relative; width: 100%; }
  .ylabels {
    position: absolute;
    left: -78px;
    top: 0;
    height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 20px;
    color: #8a8dc0;
    text-align: right;
    width: 68px;
  }
  .peakcall {
    position: absolute;
    left: 360px;
    top: -38px;
    font-size: 22px;
    font-weight: 700;
    color: #c4b5fd;
    white-space: nowrap;
  }
  .xlabels {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
    font-size: 21px;
    color: #9a9dc0;
    font-weight: 500;
  }
  .xlabels span:last-child { color: #e8e6fa; font-weight: 700; }
  .vals {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 24px;
    font-weight: 800;
  }
  .up { color: #ff6b6b; }
  .neutral { color: #d8d9d7; }
  .note {
    margin-top: 36px;
    font-size: 24px;
    color: #9fc4b9;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">원/달러 환율 · 장중 흐름</div>
    <h2>월말 네고 공백에 한때 1,363원대까지 올랐다 상승폭 축소</h2>
    <div class="chartwrap">
      <div class="ylabels">
        <span>1,365</span>
        <span>1,357</span>
        <span>1,350</span>
      </div>
      <div class="peakcall">▲ 장중 1,363원대</div>
      <svg width="860" height="220" viewBox="0 0 860 220">
        <defs>
          <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <line x1="0" y1="128" x2="860" y2="128" stroke="#8a8dc0" stroke-width="1.5" stroke-dasharray="6 8"/>
        <polygon points="0,179 430,29 860,97 860,220 0,220" fill="url(#area)"/>
        <polyline points="0,179 430,29 860,97" fill="none" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="0" cy="179" r="7" fill="#1c2740" stroke="#8a8dc0" stroke-width="3"/>
        <circle cx="430" cy="29" r="8" fill="#c4b5fd"/>
        <circle cx="860" cy="97" r="9" fill="#ff6b6b"/>
      </svg>
      <div class="xlabels">
        <span>전일 종가</span>
        <span>장중 한때</span>
        <span>마감</span>
      </div>
      <div class="vals">
        <span class="neutral">1,352.8원</span>
        <span class="neutral">1,363원대</span>
        <span class="up">1,358.4원 (+5.6원)</span>
      </div>
    </div>
    <div class="note">WGBI 자금 유입 이후 월말 달러 매도 공백 + 美 3분기 GDP 상향 겹치며 상승, 수출업체 네고 물량에 상단에서 상승폭 축소</div>
  </div>
</body>
</html>
