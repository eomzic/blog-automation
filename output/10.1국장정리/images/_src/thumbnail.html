<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1080px;
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 1080px;
    height: 1080px;
    background: linear-gradient(135deg, #0f2027 0%, #134e4a 100%);
  }
  .grain {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.045) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
    opacity: 0.5;
  }
  .glow {
    position: absolute;
    top: -180px;
    right: -160px;
    width: 640px;
    height: 640px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(94,234,212,0.22) 0%, rgba(94,234,212,0.05) 55%, rgba(94,234,212,0) 75%);
  }
  .badge {
    position: absolute;
    top: 92px;
    left: 72px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 26px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(94,234,212,0.35);
    border-radius: 999px;
    font-size: 24px;
    font-weight: 600;
    color: #cdeee7;
    letter-spacing: -0.2px;
  }
  .badge .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #5eead4;
  }
  .badge .date { color: #82a89e; font-weight: 500; }
  .content {
    position: absolute;
    top: 206px;
    left: 72px;
    width: 760px;
  }
  .eyebrow {
    font-size: 27px;
    font-weight: 500;
    color: #9fc4b9;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h1 {
    font-size: 84px;
    font-weight: 800;
    color: #f2faf7;
    line-height: 1.3;
    letter-spacing: -2.5px;
  }
  .stats {
    position: absolute;
    top: 630px;
    left: 72px;
    display: flex;
    gap: 64px;
  }
  .stat .label {
    font-size: 24px;
    color: #9fc4b9;
    font-weight: 500;
    margin-bottom: 14px;
    letter-spacing: -0.1px;
  }
  .stat .val {
    font-size: 72px;
    font-weight: 800;
    letter-spacing: -2px;
  }
  .stat .bar {
    margin-top: 22px;
    height: 10px;
    border-radius: 6px;
    background: linear-gradient(90deg, #ff6b6b, rgba(255,107,107,0.35));
  }
  .up { color: #ff6b6b; }
  .down { color: #6ea8ff; }
  .footerline {
    position: absolute;
    top: 870px;
    left: 72px;
    width: 936px;
    height: 1px;
    background: rgba(255,255,255,0.14);
  }
  .footer {
    position: absolute;
    bottom: 76px;
    left: 72px;
    right: 72px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-size: 29px;
    font-weight: 700;
    color: #f0f0ee;
  }
  .brand .bar {
    width: 32px;
    height: 4px;
    background: #5eead4;
    border-radius: 2px;
  }
  .idx {
    font-size: 24px;
    color: #9fc4b9;
    letter-spacing: -0.2px;
  }
  .idx b { color: #eafaf5; font-weight: 700; }
</style>
</head>
<body>
  <div class="stage">
    <div class="grain"></div>
    <div class="glow"></div>
    <div class="badge"><span class="dot"></span>국장정리 · 시황 <span class="date">10.1</span></div>
    <div class="content">
      <div class="eyebrow">사흘 내리 빠지다 나흘 만에 반등</div>
      <h1>반도체가 쏘아올린<br>동반 급등</h1>
    </div>
    <div class="stats">
      <div class="stat">
        <div class="label">코스피</div>
        <div class="val up">+1.95%</div>
        <div class="bar" style="width:170px"></div>
      </div>
      <div class="stat">
        <div class="label">코스닥</div>
        <div class="val up">+4.48%</div>
        <div class="bar" style="width:390px"></div>
      </div>
    </div>
    <div class="footerline"></div>
    <div class="footer">
      <div class="brand"><span class="bar"></span>내일도 주린이</div>
      <div class="idx">코스피 종가 <b>6,971.35</b></div>
    </div>
  </div>
</body>
</html>
