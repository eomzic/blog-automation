<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1080px;
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 1080px;
    height: 1080px;
    background: linear-gradient(150deg, #2d0a0a 0%, #4a1414 100%);
  }
  .grain {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
    opacity: 0.45;
  }
  .ring {
    position: absolute;
    bottom: -260px;
    left: 50%;
    transform: translateX(-50%);
    width: 760px;
    height: 760px;
    border-radius: 50%;
    border: 2px solid rgba(255,179,122,0.22);
  }
  .ring2 {
    position: absolute;
    bottom: -150px;
    left: 50%;
    transform: translateX(-50%);
    width: 560px;
    height: 560px;
    border-radius: 50%;
    border: 1px solid rgba(255,179,122,0.14);
  }
  .glow {
    position: absolute;
    top: -180px;
    left: 50%;
    transform: translateX(-50%);
    width: 640px;
    height: 640px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,138,92,0.16) 0%, rgba(255,138,92,0.03) 55%, rgba(255,138,92,0) 75%);
  }

  .wrap {
    position: relative;
    width: 1080px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .badge {
    margin-top: 92px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 26px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,179,122,0.35);
    border-radius: 999px;
    font-size: 24px;
    font-weight: 600;
    color: #ffd9bd;
    letter-spacing: -0.2px;
  }
  .badge .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ff8a5c;
  }
  .badge .date { color: #d8ab98; font-weight: 500; }

  .eyebrow {
    margin-top: 48px;
    font-size: 27px;
    font-weight: 500;
    color: #e3b9ab;
    letter-spacing: -0.2px;
    text-align: center;
  }

  h1 {
    margin-top: 22px;
    font-size: 76px;
    font-weight: 800;
    color: #fff6f1;
    line-height: 1.32;
    letter-spacing: -2px;
    text-align: center;
  }
  h1 .accent { color: #ff9b6b; }

  .statrow {
    margin-top: 56px;
    display: flex;
    align-items: center;
    gap: 0;
  }
  .stat {
    text-align: center;
    padding: 0 34px;
  }
  .stat .lbl {
    font-size: 22px;
    color: #d8ab98;
    font-weight: 500;
    margin-bottom: 10px;
  }
  .stat .pct {
    font-size: 40px;
    font-weight: 800;
    color: #ff6b6b;
    letter-spacing: -1px;
  }
  .divider {
    width: 1px;
    height: 48px;
    background: rgba(255,255,255,0.18);
  }

  .footer {
    position: absolute;
    bottom: 72px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-size: 28px;
    font-weight: 700;
    color: #fbece4;
  }
  .brand .bar {
    width: 32px;
    height: 4px;
    background: #ff8a5c;
    border-radius: 2px;
  }
  .sub2 {
    font-size: 21px;
    color: #c99589;
    letter-spacing: -0.1px;
  }
  .sub2 b { color: #ffd9bd; font-weight: 700; }
</style>
</head>
<body>
  <div class="stage">
    <div class="grain"></div>
    <div class="glow"></div>
    <div class="ring"></div>
    <div class="ring2"></div>
    <div class="wrap">
      <div class="badge"><span class="dot"></span>미장정리 · 시황 <span class="date">10.2</span></div>
      <div class="eyebrow">9월 고용 쇼크, 하루 만에 분위기 반전</div>
      <h1>나스닥 또 <span class="accent">사상최고</span><br>금리인상 베팅 급락</h1>
      <div class="statrow">
        <div class="stat"><div class="lbl">다우</div><div class="pct">+0.49%</div></div>
        <div class="divider"></div>
        <div class="stat"><div class="lbl">S&amp;P500</div><div class="pct">+0.73%</div></div>
        <div class="divider"></div>
        <div class="stat"><div class="lbl">나스닥</div><div class="pct">+1.19%</div></div>
      </div>
      <div class="footer">
        <div class="brand"><span class="bar"></span>내일도 주린이</div>
        <div class="sub2">10월 인상 확률 <b>16~21%</b>로 급락</div>
      </div>
    </div>
  </div>
</body>
</html>
