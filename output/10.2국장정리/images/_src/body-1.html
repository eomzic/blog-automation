<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #0e0e1a;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 60px;
    background: linear-gradient(150deg, #1a1a2e 0%, #1f2a4e 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #9aa3ff;
    background: rgba(154,163,255,0.14);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 42px;
    font-weight: 800;
    color: #f3f3fa;
    letter-spacing: -1px;
    line-height: 1.35;
    margin-bottom: 40px;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td {
    text-align: center;
    padding: 24px 12px;
    font-size: 26px;
  }
  thead th {
    color: #9a9dc2;
    font-weight: 600;
    font-size: 23px;
    border-bottom: 2px solid rgba(255,255,255,0.12);
  }
  thead th:first-child { text-align: left; }
  tbody td:first-child {
    text-align: left;
    color: #cfd4ff;
    font-weight: 700;
  }
  tbody tr { border-bottom: 1px solid rgba(255,255,255,0.08); }
  tbody tr:last-child { border-bottom: none; }
  tbody td { color: #e8e9f7; font-weight: 600; }
  .up { color: #ff6b6b; font-weight: 800; }
  .down { color: #6ea8ff; font-weight: 800; }
  .note {
    margin-top: 36px;
    font-size: 24px;
    color: #a9adcf;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">지수 비교 · 마감</div>
    <h2>코스피는 7000선 회복, 코스닥은 900선 문턱에서 약보합</h2>
    <table>
      <thead>
        <tr><th>구분</th><th>종가</th><th>등락</th><th>등락률</th></tr>
      </thead>
      <tbody>
        <tr><td>코스피</td><td>7,003.74</td><td class="up">+32.39</td><td class="up">+0.46%</td></tr>
        <tr><td>코스닥</td><td>893.29</td><td class="down">-1.00</td><td class="down">-0.11%</td></tr>
      </tbody>
    </table>
    <div class="note">코스닥은 장중 900선을 잠깐 넘었지만 상승분을 반납하고 약보합 마감, 기관 순매수가 코스피 지수를 지지했다</div>
  </div>
</body>
</html>
