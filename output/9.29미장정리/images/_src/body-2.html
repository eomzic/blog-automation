<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #14101f;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 60px;
    background: linear-gradient(150deg, #1a1a2e 0%, #2d1b54 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #c4b5fd;
    background: rgba(167,139,250,0.14);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 42px;
    font-weight: 800;
    color: #f6f4fc;
    letter-spacing: -1px;
    line-height: 1.3;
    margin-bottom: 40px;
  }
  .flow { position: relative; }
  .step { position: relative; display: flex; gap: 26px; padding-bottom: 40px; }
  .step:last-child { padding-bottom: 0; }
  .step .line {
    position: absolute;
    left: 23px;
    top: 50px;
    bottom: 0;
    width: 2px;
    background: rgba(167,139,250,0.25);
  }
  .step:last-child .line { display: none; }
  .num {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(167,139,250,0.16);
    border: 1px solid rgba(167,139,250,0.45);
    color: #c4b5fd;
    font-size: 24px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }
  .body { padding-top: 4px; }
  .body .h {
    font-size: 30px;
    font-weight: 700;
    color: #f6f4fc;
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }
  .body .d { font-size: 24px; color: #b9aede; line-height: 1.5; }
  .body .d b { color: #6ea8ff; font-weight: 700; }
  .body .d b.warn { color: #ffd39a; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">12년 만 최저 · 소비자신뢰지수</div>
    <h2>81.9, 예상(89.2)마저 크게 밑돌았다</h2>
    <div class="flow">
      <div class="step">
        <div class="line"></div>
        <div class="num">1</div>
        <div class="body">
          <div class="h">소비자신뢰지수 88.6 → 81.9</div>
          <div class="d"><b class="warn">-6.7pt</b>, 2014년 이후 12년 만에 최저 수준</div>
        </div>
      </div>
      <div class="step">
        <div class="line"></div>
        <div class="num">2</div>
        <div class="body">
          <div class="h">현재상황지수 117.2 → 109.3</div>
          <div class="d"><b>-7.9pt</b>, 현재 경기 인식이 가장 크게 꺾임</div>
        </div>
      </div>
      <div class="step">
        <div class="line"></div>
        <div class="num">3</div>
        <div class="body">
          <div class="h">기대지수 69.5 → 63.6</div>
          <div class="d"><b>-5.9pt</b>, 향후 경기에 대한 기대도 동반 하락</div>
        </div>
      </div>
      <div class="step">
        <div class="num">4</div>
        <div class="body">
          <div class="h">12개월 기대 인플레이션 5.8% → 6.1%</div>
          <div class="d">체감 물가는 오히려 <b class="warn">+0.3%p</b> 상승, 유가·연료비 언급 급증</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
