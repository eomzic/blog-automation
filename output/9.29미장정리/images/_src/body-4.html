<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #14101f;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 56px;
    background: linear-gradient(150deg, #1a1a2e 0%, #2d1b54 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #c4b5fd;
    background: rgba(167,139,250,0.14);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 40px;
    font-weight: 800;
    color: #f6f4fc;
    letter-spacing: -1px;
    line-height: 1.3;
    margin-bottom: 36px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }
  .stock {
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 18px;
    padding: 24px 26px 22px;
  }
  .stock .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .stock .name { font-size: 26px; font-weight: 700; color: #f6f4fc; }
  .stock .val { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  .stock .note { font-size: 19px; color: #8f84b3; margin-bottom: 14px; }
  .bar-bg { width: 100%; height: 10px; background: rgba(255,255,255,0.08); border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; }
  .up { color: #ff6b6b; }
  .down { color: #6ea8ff; }
  .bar-up { background: #ff6b6b; }
  .bar-down { background: #6ea8ff; }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">종목별 등락률 · 반도체·빅테크</div>
    <h2>ARM -8.7% 급락, 장비주는 나홀로 강세</h2>
    <div class="grid">
      <div class="stock">
        <div class="row"><span class="name">ARM홀딩스</span><span class="val down">-8.7%</span></div>
        <div class="note">이날 최대 낙폭</div>
        <div class="bar-bg"><div class="bar-fill bar-down" style="width:100%"></div></div>
      </div>
      <div class="stock">
        <div class="row"><span class="name">필라델피아반도체(SOXX)</span><span class="val down">-2.08%</span></div>
        <div class="note">반도체 섹터 전반 약세</div>
        <div class="bar-bg"><div class="bar-fill bar-down" style="width:24%"></div></div>
      </div>
      <div class="stock">
        <div class="row"><span class="name">어플라이드 머티리얼즈</span><span class="val up">+4.56%</span></div>
        <div class="note">장비주 강세</div>
        <div class="bar-bg"><div class="bar-fill bar-up" style="width:52%"></div></div>
      </div>
      <div class="stock">
        <div class="row"><span class="name">램리서치</span><span class="val up">+3.69%</span></div>
        <div class="note">장비주 강세</div>
        <div class="bar-bg"><div class="bar-fill bar-up" style="width:42%"></div></div>
      </div>
      <div class="stock">
        <div class="row"><span class="name">애플</span><span class="val down">-1.60%</span></div>
        <div class="note">대형 기술주 약세</div>
        <div class="bar-bg"><div class="bar-fill bar-down" style="width:18%"></div></div>
      </div>
      <div class="stock">
        <div class="row"><span class="name">알파벳</span><span class="val down">-1.58%</span></div>
        <div class="note">대형 기술주 약세</div>
        <div class="bar-bg"><div class="bar-fill bar-down" style="width:18%"></div></div>
      </div>
    </div>
  </div>
</body>
</html>
