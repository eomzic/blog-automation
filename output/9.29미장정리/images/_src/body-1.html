<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    font-family: 'Apple SD Gothic Neo', -apple-system, sans-serif;
    background: #14101f;
  }
  .card {
    width: 1000px;
    padding: 64px 68px 56px;
    background: linear-gradient(150deg, #1a1a2e 0%, #2d1b54 100%);
    border-radius: 28px;
  }
  .tag {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    color: #c4b5fd;
    background: rgba(167,139,250,0.14);
    padding: 8px 18px;
    border-radius: 999px;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }
  h2 {
    font-size: 42px;
    font-weight: 800;
    color: #f6f4fc;
    letter-spacing: -1px;
    line-height: 1.3;
    margin-bottom: 36px;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 24px;
    font-weight: 600;
    color: #a99fd4;
    padding: 0 0 18px;
    border-bottom: 2px solid rgba(255,255,255,0.12);
  }
  thead th:not(:first-child), tbody td:not(:first-child) { text-align: right; }
  tbody td {
    font-size: 30px;
    font-weight: 700;
    color: #f6f4fc;
    padding: 24px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  tbody tr:last-child td { border-bottom: none; }
  .name { font-weight: 700; color: #f6f4fc; display: flex; align-items: center; gap: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #a78bfa; }
  .mono { color: #cabdf0; font-weight: 500; font-size: 27px; }
  .up { color: #ff6b6b; }
  .down { color: #6ea8ff; }
  .note {
    margin-top: 34px;
    font-size: 24px;
    color: #b9aede;
    line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="tag">이틀 비교 · 3대지수 마감</div>
    <h2>전일 급락 뒤, 낙폭 확 줄인 "조용한 하락"</h2>
    <table>
      <thead>
        <tr><th>지수</th><th>9/28</th><th>9/29</th><th>등락률</th></tr>
      </thead>
      <tbody>
        <tr>
          <td class="name"><span class="dot"></span>다우존스</td>
          <td class="mono">51,481.10</td>
          <td class="mono">51,349.92</td>
          <td class="down">-0.25%</td>
        </tr>
        <tr>
          <td class="name"><span class="dot"></span>S&amp;P500</td>
          <td class="mono">7,683.69</td>
          <td class="mono">7,670.84</td>
          <td class="down">-0.16%</td>
        </tr>
        <tr>
          <td class="name"><span class="dot"></span>나스닥종합</td>
          <td class="mono">26,820.38</td>
          <td class="mono">26,797.50</td>
          <td class="down">-0.09%</td>
        </tr>
        <tr>
          <td class="name"><span class="dot"></span>러셀2000</td>
          <td class="mono">-</td>
          <td class="mono">2,807</td>
          <td class="down">-0.35%</td>
        </tr>
      </tbody>
    </table>
    <div class="note">전날 국채금리 급등·유가 상승 여파로 크게 밀렸던 것과 달리, 9/29은 낙폭이 확 줄어든 "조용한 하락(muted trading)" 장세였다.</div>
  </div>
</body>
</html>
