<html><head><meta charset="UTF-8"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Apple SD Gothic Neo','Pretendard',sans-serif}
.card{width:1000px;background:linear-gradient(160deg,#232526 0%,#3a3d40 100%);padding:48px 56px;color:#fff}
.eyebrow{font-size:20px;font-weight:700;color:#b8c4a8;margin-bottom:8px}h2{font-size:30px;font-weight:800;margin-bottom:30px}
.row{display:flex;align-items:center;gap:16px;margin-bottom:14px}.nm{width:210px;font-size:22px;font-weight:700}
.track{flex:1;height:34px;position:relative;background:rgba(255,255,255,.06);border-radius:8px}
.mid{position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.3)}
.bar{position:absolute;top:4px;bottom:4px;border-radius:5px}.v{width:110px;text-align:right;font-size:22px;font-weight:800}
.foot{margin-top:18px;font-size:15px;color:rgba(255,255,255,.45)}</style></head><body><div class="card"><div class="eyebrow">S&P500 업종별</div><h2>방어주는 오르고 기술은 빠졌다</h2><div class="row"><div class="nm">에너지</div><div class="track"><div class="mid"></div><div class="bar" style="left:50%;width:45.31249999999999%;background:#ff6b6b"></div></div><div class="v" style="color:#ff6b6b">+1.45%</div></div><div class="row"><div class="nm">필수소비재</div><div class="track"><div class="mid"></div><div class="bar" style="left:50%;width:36.5625%;background:#ff6b6b"></div></div><div class="v" style="color:#ff6b6b">+1.17%</div></div><div class="row"><div class="nm">경기소비재</div><div class="track"><div class="mid"></div><div class="bar" style="right:50%;width:16.5625%;background:#5aa2ff"></div></div><div class="v" style="color:#5aa2ff">-0.53%</div></div><div class="row"><div class="nm">기술</div><div class="track"><div class="mid"></div><div class="bar" style="right:50%;width:39.0625%;background:#5aa2ff"></div></div><div class="v" style="color:#5aa2ff">-1.25%</div></div><div class="foot">※ 데이터를 시각화한 합성 그래픽 · 상승=빨강 / 하락=파랑</div></div></body></html>
